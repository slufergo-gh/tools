<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<title>逐頁筆記</title>
<style>
:root{--bg:#0f1418;--panel:#182027;--line:#26313a;--fg:#e9eef2;--muted:#8a99a6;--accent:#2f80ed;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
a.back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
.sp{flex:1}
button,.btn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:default}
#saved{font-size:12px;color:var(--muted);white-space:nowrap}
#tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;max-width:240px;padding:7px 8px 7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;font-size:13px;flex-shrink:0;background:var(--panel)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{border:0;padding:0 4px;font-size:16px;line-height:1;color:inherit;opacity:.7}
.tab .x:hover{opacity:1}
main{flex:1;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#empty{max-width:560px;margin:8vh auto;text-align:center;color:var(--muted)}
#drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:40px 16px;cursor:pointer;margin-bottom:14px}
#drop b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
body.over #drop,body.over main{outline:2px dashed var(--accent);outline-offset:-6px}
.hint{font-size:13px;color:var(--muted);line-height:1.6}
#pages{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.slide{position:relative;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.slide canvas{display:block;width:100%;height:100%}
.slide .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:1px 7px;border-radius:6px}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.6;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.notecol{position:sticky;top:100px}
@media (max-width:600px){.bar h1,#saved{display:none}.bar{gap:6px;flex-wrap:nowrap}.bar button{padding:6px 9px;font-size:13px}#tabs{margin-top:8px}}
@media (max-width:760px){.row{grid-template-columns:1fr;gap:8px}.notecol{position:static}textarea{min-height:90px}}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:17px;margin:0 0 14px}
.opt{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);margin-bottom:14px}
.opt select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.check input{width:18px;height:18px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#status{font-size:13px;color:var(--muted);margin-top:10px;min-height:1em}
#more{position:relative}
#menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:200px;z-index:10}
#menu button{border:0;text-align:left;padding:10px 12px}
#menu button:hover{background:var(--line)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="../">‹ 工具</a>
    <h1>逐頁筆記</h1>
    <span id="saved"></span>
    <span class="sp"></span>
    <button id="openPdf">＋ 開啟 PDF</button>
    <button id="openSave">讀檔</button>
    <button id="saveFile" disabled>存檔</button>
    <button id="exportBtn" class="main" disabled>輸出 Word</button>
  </div>
  <div id="tabs"></div>
  <input id="pdfInput" type="file" accept="application/pdf,.pdf,.ppt,.pptx" multiple hidden>
  <input id="saveInput" type="file" accept=".zip,application/zip,.json" multiple hidden>
</header>
<main>
  <div id="empty" hidden>
    <label id="drop" for="pdfInput"><b>選擇或拖曳 PDF</b>每一頁旁邊都有筆記欄，寫完可輸出成 Word</label>
    <p class="hint">筆記會自動暫存在這台裝置的瀏覽器裡，關掉再開也還在。<br>
    「存檔」會把 PDF 和筆記一起存成一個檔案，可以備份或拿到別台電腦用「讀檔」繼續寫。<br>
    PowerPoint 請先「另存新檔 → PDF」再開啟。</p>
  </div>
  <div id="pages"></div>
</main>

<dialog id="exportDlg">
  <h2>輸出 Word</h2>
  <label class="opt">版面
    <select id="layout">
      <option value="stack">上面投影片、下面筆記</option>
      <option value="side">左邊投影片、右邊筆記</option>
    </select>
  </label>
  <label class="opt">輸出哪些檔案
    <select id="scope">
      <option value="cur">目前這個檔案</option>
      <option value="all">所有開啟的檔案（合成一份）</option>
    </select>
  </label>
  <label class="opt check"><input id="onlyNoted" type="checkbox">只放有寫筆記的頁面</label>
  <label class="opt check"><input id="border" type="checkbox" checked>投影片加細框</label>
  <label class="opt check"><input id="num" type="checkbox" checked>標上頁碼</label>
  <div id="status"></div>
  <div class="acts"><button id="cancelExp">取消</button><button id="doExp" class="main">下載</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const PDF_OPTS={cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'};

// ================= 暫存（IndexedDB） =================
// docs: {id, name, pdf:ArrayBuffer, notes:{頁碼:文字}, numPages, order, updated}
let dbp;
function db(){
  return dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open('pageNotes',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
}
async function tx(mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction('docs',mode),s=t.objectStore('docs');
    let out;const r=fn(s);if(r)r.onsuccess=()=>out=r.result;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const dbAll=()=>tx('readonly',s=>s.getAll());
const dbPut=d=>tx('readwrite',s=>s.put(d));
const dbDel=id=>tx('readwrite',s=>s.delete(id));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

// ================= 狀態 =================
const docs=[];      // 開啟中的檔案（記憶體）
let cur=null;       // 目前的檔案
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const baseName=n=>n.replace(/\.pdf$/i,'');

async function pdfOf(d){
  if(!d.pdfDoc)d.pdfDoc=pdfjsLib.getDocument({data:d.pdf.slice(0),...PDF_OPTS}).promise;
  return d.pdfDoc;
}

// ================= 儲存筆記 =================
let saveTimer=null;const dirty=new Set();
function markDirty(d){
  dirty.add(d);d.updated=Date.now();
  $('saved').textContent='編輯中…';
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  clearTimeout(saveTimer);
  const list=[...dirty];dirty.clear();
  try{
    for(const d of list)await dbPut(rec(d));
    if(list.length)$('saved').textContent='✓ 已暫存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){console.error(e);$('saved').textContent='⚠ 暫存失敗，請記得存檔';}
}
const rec=d=>({id:d.id,name:d.name,pdf:d.pdf,notes:d.notes,numPages:d.numPages,order:d.order,updated:d.updated});
window.addEventListener('pagehide',()=>{if(dirty.size)flush();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty.size)flush();});

// ================= 開檔 =================
async function addPdf(file){
  const buf=await file.arrayBuffer();
  const same=docs.find(d=>d.name===file.name&&d.pdf.byteLength===buf.byteLength);
  if(same){select(same);return same;}
  return addDoc({id:newId(),name:file.name,pdf:buf,notes:{}});
}
async function addDoc(o){
  const d={...o,order:o.order??Date.now(),updated:o.updated||Date.now()};
  try{const p=await pdfOf(d);d.numPages=p.numPages;}
  catch(e){alert(`無法讀取 ${d.name}：${e.message}`);return null;}
  docs.push(d);
  await dbPut(rec(d)).catch(e=>{console.error(e);$('saved').textContent='⚠ 暫存失敗（空間不足？），請記得存檔';});
  select(d);
  return d;
}
async function openFiles(files){
  if(files.some(f=>/\.pptx?$/i.test(f.name)))alert('PowerPoint 檔請先在 PowerPoint 用「另存新檔 → PDF」再開啟。');
  for(const f of files){
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf')await addPdf(f);
    else if(/\.(zip|json)$/i.test(f.name))await loadSave(f);
  }
}
$('openPdf').onclick=()=>$('pdfInput').click();
$('openSave').onclick=()=>$('saveInput').click();
$('pdfInput').onchange=e=>{openFiles([...e.target.files]);e.target.value='';};
$('saveInput').onchange=e=>{openFiles([...e.target.files]);e.target.value='';};
let dragN=0;
document.addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('over');});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('over');}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('over');openFiles([...e.dataTransfer.files]);});

// ================= 存檔 / 讀檔 =================
// 存檔格式：zip，內含 document.pdf 與 notes.json
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}
async function makeSave(d){
  const z=new JSZip();
  z.file('notes.json',JSON.stringify({app:'page-notes',v:1,id:d.id,name:d.name,notes:d.notes,updated:d.updated},null,1));
  z.file('document.pdf',d.pdf);
  return z.generateAsync({type:'blob',mimeType:'application/zip'});
}
$('saveFile').onclick=async()=>{
  if(!cur)return;await flush();
  download(await makeSave(cur),baseName(cur.name)+'-筆記存檔.zip');
};
async function loadSave(file){
  try{
    let meta,pdf;
    if(/\.json$/i.test(file.name)){meta=JSON.parse(await file.text());}
    else{const z=await JSZip.loadAsync(file);
      meta=JSON.parse(await z.file('notes.json').async('string'));
      pdf=await z.file('document.pdf').async('arraybuffer');}
    if(meta.app!=='page-notes')throw new Error('不是逐頁筆記的存檔');
    const exist=docs.find(d=>d.id===meta.id);
    if(exist){
      if(!confirm(`「${exist.name}」已經開著。\n要用存檔裡的筆記取代目前的筆記嗎？`)){select(exist);return;}
      exist.notes=meta.notes||{};exist.updated=Date.now();
      await dbPut(rec(exist));select(exist,true);return;
    }
    if(!pdf){ // 舊版只有 json：請使用者另外選 PDF
      alert('這個存檔沒有包含 PDF，請接著選原本的 PDF 檔。');return;
    }
    await addDoc({id:meta.id||newId(),name:meta.name||file.name,pdf,notes:meta.notes||{},updated:meta.updated});
  }catch(e){console.error(e);alert(`讀檔失敗（${file.name}）：${e.message}`);}
}

// ================= 分頁（多檔切換） =================
function drawTabs(){
  const box=$('tabs');box.innerHTML='';
  docs.sort((a,b)=>a.order-b.order).forEach(d=>{
    const t=document.createElement('div');t.className='tab'+(d===cur?' on':'');t.title=d.name;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=baseName(d.name);
    const x=document.createElement('button');x.className='x';x.textContent='×';x.title='關閉';
    x.onclick=e=>{e.stopPropagation();closeDoc(d);};
    t.onclick=()=>select(d);
    t.append(nm,x);box.appendChild(t);
  });
  const has=!!cur;
  $('saveFile').disabled=!has;$('exportBtn').disabled=!has;
  $('empty').hidden=has;
}
async function closeDoc(d){
  const n=Object.values(d.notes).filter(v=>v.trim()).length;
  if(n&&!confirm(`關閉「${baseName(d.name)}」？\n這份有 ${n} 頁筆記，關閉後會從暫存刪除。\n如果還要用，請先按「存檔」或「輸出 Word」。`))return;
  dirty.delete(d);
  docs.splice(docs.indexOf(d),1);
  await dbDel(d.id).catch(()=>{});
  d.pdfDoc&&d.pdfDoc.then(p=>p.destroy()).catch(()=>{});
  if(cur===d){cur=null;select(docs[docs.length-1]||null);}else drawTabs();
}

// ================= 頁面 + 筆記欄 =================
let io=null,renderGen=0;
function remember(){if(cur){cur.scroll=window.scrollY;}}
window.addEventListener('scroll',()=>{if(cur)cur.scroll=window.scrollY;},{passive:true});
async function select(d,force){
  if(d===cur&&!force){drawTabs();return;}
  await flush();
  remember();
  cur=d;ls.set('pageNotesCur',d?d.id:'');
  drawTabs();
  const gen=++renderGen;
  const box=$('pages');box.innerHTML='';
  if(io)io.disconnect();
  if(!d)return;
  const pdf=await pdfOf(d);
  if(gen!==renderGen)return;
  const p1=await pdf.getPage(1),vp1=p1.getViewport({scale:1});
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);drawPage(pdf,e.target,gen);}}),{rootMargin:'800px 0px'});
  const frag=document.createDocumentFragment();
  for(let i=1;i<=d.numPages;i++){
    const row=document.createElement('div');row.className='row';
    const sl=document.createElement('div');sl.className='slide';sl.dataset.page=i;
    sl.style.aspectRatio=`${vp1.width} / ${vp1.height}`;
    const no=document.createElement('span');no.className='no';no.textContent=i;sl.appendChild(no);
    const col=document.createElement('div');col.className='notecol';
    const ta=document.createElement('textarea');ta.placeholder=`第 ${i} 頁筆記`;ta.value=d.notes[i]||'';
    ta.oninput=()=>{const v=ta.value;if(v)d.notes[i]=v;else delete d.notes[i];markDirty(d);autoGrow(ta);};
    col.appendChild(ta);row.append(sl,col);frag.appendChild(row);
    io.observe(sl);
  }
  box.appendChild(frag);
  box.querySelectorAll('textarea').forEach(autoGrow);
  window.scrollTo(0,d.scroll||0);
}
function autoGrow(ta){ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight+2,0)+'px';}
async function drawPage(pdf,sl,gen){
  const page=await pdf.getPage(+sl.dataset.page);
  if(gen!==renderGen)return;
  const vp1=page.getViewport({scale:1});
  sl.style.aspectRatio=`${vp1.width} / ${vp1.height}`;
  const w=sl.clientWidth*Math.min(2,window.devicePixelRatio||1);
  const vp=page.getViewport({scale:Math.max(0.5,w/vp1.width)});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  if(gen!==renderGen)return;
  sl.prepend(c);page.cleanup();
}
let rzT;window.addEventListener('resize',()=>{
  clearTimeout(rzT);rzT=setTimeout(()=>{ // 寬度變大很多才重畫
    document.querySelectorAll('textarea').forEach(autoGrow);
  },200);
});

// ================= 輸出 Word =================
const ekeys=['layout','scope','onlyNoted','border','num'];
try{const s=JSON.parse(ls.get('pageNotesExp')||'{}');ekeys.forEach(k=>{if(s[k]!==undefined){const el=$(k);el.type==='checkbox'?el.checked=s[k]:el.value=s[k];}});}catch(e){}
$('exportBtn').onclick=async()=>{await flush();$('status').textContent='';$('scope').disabled=docs.length<2;if(docs.length<2)$('scope').value='cur';$('exportDlg').showModal();};
$('cancelExp').onclick=()=>$('exportDlg').close();
$('doExp').onclick=async()=>{
  const s={};ekeys.forEach(k=>{const el=$(k);s[k]=el.type==='checkbox'?el.checked:el.value;});ls.set('pageNotesExp',JSON.stringify(s));
  $('doExp').disabled=true;
  try{
    const list=s.scope==='all'?[...docs]:[cur];
    const blob=await buildDocx(list,s);
    const name=(list.length>1?'逐頁筆記':baseName(cur.name))+'-筆記.docx';
    download(blob,name);
    $('status').textContent='已下載：'+name;
    setTimeout(()=>$('exportDlg').close(),900);
  }catch(e){console.error(e);$('status').textContent='產生失敗：'+e.message;}
  $('doExp').disabled=false;
};

const EMU=635, MARGIN=1134, PW=11906, PH=16838, UW=PW-2*MARGIN, UH=PH-2*MARGIN;
const esc=t=>t.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(inner='',ppr='')=>`<w:p>${ppr?`<w:pPr>${ppr}</w:pPr>`:''}${inner}</w:p>`;
const R=(t,rpr='')=>`<w:r>${rpr?`<w:rPr>${rpr}</w:rPr>`:''}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const CAP=t=>P(R(t,'<w:color w:val="7F7F7F"/><w:sz w:val="18"/>'),'<w:keepNext/>');
const noteParas=t=>t?t.replace(/\r/g,'').split('\n').map(l=>P(R(l))).join(''):P();
function picXml(idx,cx,cy,border){
  const ln=border?'<a:ln w="6350"><a:solidFill><a:srgbClr val="A6A6A6"/></a:solidFill></a:ln>':'';
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${idx}" name="投影片 ${idx}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${idx}" name="slide${idx}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="img${idx}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>${ln}</pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
async function pageJpg(page){
  const vp1=page.getViewport({scale:1});
  const vp=page.getViewport({scale:Math.min(4,1600/Math.max(vp1.width,vp1.height))});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));c.width=c.height=0;
  return {blob:b,ratio:vp1.height/vp1.width};
}
async function buildDocx(list,o){
  const zip=new JSZip();let body='',rels='',idx=0;
  const jobs=[];
  list.forEach(d=>{for(let i=1;i<=d.numPages;i++){const t=(d.notes[i]||'').trim()?d.notes[i]:'';if(!o.onlyNoted||t)jobs.push({d,i,t});}});
  if(!jobs.length)throw new Error('沒有任何頁面有筆記');
  let lastDoc=null;
  for(const j of jobs){
    idx++;$('status').textContent=`處理中 ${idx} / ${jobs.length}`;
    const pdf=await pdfOf(j.d),page=await pdf.getPage(j.i);
    const {blob,ratio}=await pageJpg(page);page.cleanup();
    zip.file(`word/media/slide${idx}.jpg`,blob);
    rels+=`<Relationship Id="img${idx}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/slide${idx}.jpg"/>`;
    if(list.length>1&&j.d!==lastDoc){
      body+=P(R(baseName(j.d.name)),'<w:pStyle w:val="Heading1"/>'+(lastDoc?'<w:pageBreakBefore/>':''));
    }
    lastDoc=j.d;
    const cap=o.num?`第 ${j.i} 頁`:null;
    if(o.layout==='side'){
      const L=Math.round(UW*0.55),Rw=UW-L;
      let cx=(L-120)*EMU,cy=Math.round(cx*ratio);
      const max=(UH-600)*EMU;if(cy>max){cy=max;cx=Math.round(cy/ratio);}
      body+=`<w:tbl><w:tblPr><w:tblW w:w="${UW}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:bottom w:val="single" w:sz="4" w:color="D9D9D9"/></w:tblBorders><w:tblCellMar><w:top w:w="100" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="100" w:type="dxa"/><w:right w:w="160" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${L}"/><w:gridCol w:w="${Rw}"/></w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="${L}" w:type="dxa"/></w:tcPr>${cap?CAP(cap):''}${P(picXml(idx,cx,cy,o.border),'<w:spacing w:line="240" w:lineRule="auto"/>')}</w:tc><w:tc><w:tcPr><w:tcW w:w="${Rw}" w:type="dxa"/></w:tcPr>${cap?P():''}${noteParas(j.t)}</w:tc></w:tr></w:tbl>`;
    }else{
      let cx=Math.round(UW*0.8*EMU),cy=Math.round(cx*ratio);
      const max=(UH*0.6)*EMU;if(cy>max){cy=Math.round(max);cx=Math.round(cy/ratio);}
      if(cap)body+=CAP(cap);
      body+=P(picXml(idx,cx,cy,o.border),'<w:keepNext/><w:spacing w:before="60" w:after="120" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/>');
      body+=noteParas(j.t)+P('','<w:spacing w:after="240"/>');
    }
  }
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}<w:sectPr><w:pgSz w:w="${PW}" w:h="${PH}"/><w:pgMar w:top="${MARGIN}" w:right="${MARGIN}" w:bottom="${MARGIN}" w:left="${MARGIN}" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${rels}</Relationships>`);
  zip.file('word/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="微軟正黑體" w:cs="Calibri"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="en-US" w:eastAsia="zh-TW"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style></w:styles>`);
  zip.file('word/document.xml',doc);
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

(async()=>{
  try{
    const all=(await dbAll()).sort((a,b)=>a.order-b.order);
    for(const r of all){
      const d={...r};
      try{const p=await pdfOf(d);d.numPages=p.numPages;docs.push(d);}catch(e){console.error(e);}
    }
  }catch(e){console.error(e);$('saved').textContent='⚠ 這個瀏覽器無法暫存（無痕模式？），請記得存檔';}
  const want=ls.get('pageNotesCur');
  await select(docs.find(d=>d.id===want)||docs[docs.length-1]||null,true);
  if(!docs.length)drawTabs();
})();
window.__test={docs,openFiles,buildDocx,flush,get cur(){return cur;}};
