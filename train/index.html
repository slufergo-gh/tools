<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="轉乘時刻">
<title>轉乘時刻</title>
<style>
:root{--bg:#0f1418;--panel:#182027;--line:#26313a;--fg:#e9eef2;--muted:#8a99a6;--accent:#2f80ed;--thsr:#f08a24;--tra:#4fb3a9;--warn:#eb5757;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
button:active{border-color:var(--accent)}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;border-bottom:1px solid var(--line)}
.route{display:flex;align-items:center;gap:8px}
.route .txt{flex:1;min-width:0;font-size:15px;line-height:1.4}
.route .txt b{font-size:18px}
.route .txt span{color:var(--muted)}
.route button{padding:8px 12px;font-size:15px;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{padding:12px 6px;font-size:17px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.small button{padding:8px 6px;font-size:15px}
.seg.small button.on{background:#1d3350;border-color:var(--accent);color:var(--fg)}
.status{font-size:14px;color:var(--muted);margin:10px 2px 0;min-height:1em}
.status.err{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card.past{opacity:.45}
.row{display:flex;align-items:baseline;gap:10px}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;color:#111;white-space:nowrap}
.tag.thsr{background:var(--thsr)}
.tag.tra{background:var(--tra)}
.thsrline{font-size:22px;font-weight:700;letter-spacing:.02em}
.sub{font-size:14px;color:var(--muted);margin:2px 0 0 52px}
.tras{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.tr{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:17px}
.tr .lbl{font-size:12px;color:var(--muted);width:3.2em;flex:none}
.tr .t{font-weight:600;font-variant-numeric:tabular-nums}
.tr .s{color:var(--muted);font-size:14px}
.tr .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.tr.gone{opacity:.4;text-decoration:line-through}
.tr.none{color:var(--muted);font-size:15px}
.q{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px}
.q input{min-width:0;width:100%;padding:10px 6px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.q button{padding:10px 18px;font-size:17px;background:var(--accent);border-color:var(--accent);color:#fff}
.throw{display:block;width:100%;text-align:left;padding:0;background:none;border:0;border-radius:0}
.throw .chev{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.tras.up{margin:0 0 10px;padding:0 0 8px;border-top:0;border-bottom:1px dashed var(--line)}
.addmore{display:block;width:100%;margin-top:6px;padding:10px;font-size:15px;color:var(--muted)}
.more{display:block;width:100%;margin-top:12px;padding:12px;color:var(--muted)}
/* 設定 */
.set h1{font-size:22px;margin:6px 0 4px}
.set p.hint{font-size:14px;color:var(--muted);line-height:1.6;margin:4px 0 14px}
.set label{display:block;font-size:14px;color:var(--muted);margin:16px 2px 6px}
.set select,.set input[type=text],.set input[type=number],.set input[type=password]{width:100%;padding:12px;font-size:17px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.set .two{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.set .two.eq{grid-template-columns:1fr 1fr}
.set h2.sec{font-size:17px;margin:28px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.set .chk{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--fg);margin-top:18px}
.set .chk input{width:22px;height:22px;accent-color:var(--accent)}
.set details{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.set summary{font-size:16px;cursor:pointer}
.set .save{width:100%;margin-top:24px;padding:16px;font-size:19px;background:var(--accent);border-color:var(--accent);color:#fff}
.set .cancel{width:100%;margin-top:10px;padding:12px;color:var(--muted)}
.set a{color:#7fb2ff}
.hidden{display:none!important}
</style>
</head>
<body>
<main>

<!-- 查詢畫面 -->
<section id="view" class="hidden">
  <div class="top">
    <div class="route">
      <div class="txt" id="routeTxt"></div>
      <button id="btnSet">設定</button>
    </div>
    <div class="seg" id="dirSeg">
      <button data-dir="go">去程</button>
      <button data-dir="back">回程</button>
    </div>
    <div class="q">
      <input type="date" id="qDate" aria-label="日期">
      <input type="time" id="qTime" aria-label="高鐵出發時間">
      <button id="btnQuery">查詢</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <button class="more hidden" id="btnEarlier">更早的高鐵</button>
  <div id="list"></div>
</section>

<!-- 設定畫面 -->
<section id="setup" class="set hidden">
  <h1>設定路線</h1>
  <p class="hint">設定一次就好，之後打開就直接顯示，隨時可以按「設定」再改。</p>

  <h2 class="sec">去程（區間車 → 高鐵）</h2>
  <label>台鐵上車站</label>
  <div class="two"><select id="gTraFromC"></select><select id="gTraFromS"></select></div>
  <label>台鐵下車站（轉乘高鐵）</label>
  <div class="two"><select id="gTraToC"></select><select id="gTraToS"></select></div>
  <label>高鐵</label>
  <div class="two eq"><select id="gThFrom"></select><select id="gThTo"></select></div>

  <h2 class="sec">回程（高鐵 → 區間車）</h2>
  <label class="chk"><input type="checkbox" id="sSame"> 回程就是去程反過來</label>
  <div id="backBox">
    <label>高鐵</label>
    <div class="two eq"><select id="bThFrom"></select><select id="bThTo"></select></div>
    <label>台鐵上車站（下高鐵後）</label>
    <div class="two"><select id="bTraFromC"></select><select id="bTraFromS"></select></div>
    <label>台鐵下車站</label>
    <div class="two"><select id="bTraToC"></select><select id="bTraToS"></select></div>
  </div>

  <h2 class="sec">其他</h2>
  <label for="sBuf">轉乘預留時間（分鐘）</label>
  <input type="number" id="sBuf" min="0" max="60" inputmode="numeric">

  <label class="chk"><input type="checkbox" id="sLocal"> 只看區間車、區間快</label>

  <details id="keyBox">
    <summary>TDX 金鑰（選填，查詢次數不夠時再填）</summary>
    <p class="hint">時刻資料來自交通部 TDX。不填也能查，但每天次數有限。到 <a href="https://tdx.transportdata.tw/register" target="_blank" rel="noopener">TDX 免費註冊</a>，在「會員中心 → API 金鑰」可以看到 Client Id 和 Client Secret，貼進來即可。金鑰只存在這支手機裡。</p>
    <label for="sCid">Client Id</label>
    <input type="text" id="sCid" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="sSec">Client Secret</label>
    <input type="password" id="sSec" autocomplete="off">
  </details>

  <div class="status" id="setStatus"></div>
  <button class="save" id="btnSave">儲存</button>
  <button class="cancel hidden" id="btnCancel">取消</button>
</section>

</main>
<script>
(() => {
'use strict';
const API = 'https://tdx.transportdata.tw/api/basic';
const TOKEN_URL = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
const DEMO = new URLSearchParams(location.search).has('demo');
const LS = DEMO ? 'trd_' : 'tr_';

// 高鐵站（TDX StationID）
const THSR = [['0990','南港'],['1000','台北'],['1010','板橋'],['1020','桃園'],['1030','新竹'],['1035','苗栗'],
  ['1040','台中'],['1043','彰化'],['1047','雲林'],['1050','嘉義'],['1060','台南'],['1070','左營']];
// 可用台鐵轉乘的高鐵站：高鐵站名 → 台鐵站名
const XFER = [['南港','南港'],['台北','臺北'],['板橋','板橋'],['新竹','六家'],['苗栗','豐富'],
  ['台中','新烏日'],['台南','沙崙'],['左營','新左營']];

const $ = id => document.getElementById(id);
const norm = s => (s || '').replace(/臺/g, '台').trim();
const get = (k, d) => { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} };
const del = k => { try { localStorage.removeItem(LS + k); } catch {} };
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let cfg = get('cfg', null);
let state = { dir: get('dir', 'go'), th: null, tr: null, open: {}, nowMin: -1, from: 0 };

// ---------- TDX ----------
async function token() {
  if (!cfg || !cfg.cid || !cfg.sec) return null;
  const t = get('tok', null);
  if (t && t.cid === cfg.cid && t.exp > Date.now() + 60000) return t.v;
  const r = await fetch(TOKEN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'client_credentials', client_id: cfg.cid, client_secret: cfg.sec })
  });
  if (!r.ok) throw new Error('TDX 金鑰無法登入，請到設定檢查 Client Id／Secret');
  const j = await r.json();
  put('tok', { cid: cfg.cid, v: j.access_token, exp: Date.now() + (j.expires_in || 3600) * 1000 });
  return j.access_token;
}
async function tdx(path) {
  const url = API + path + (path.includes('?') ? '&' : '?') + '$format=JSON';
  const headers = {};
  const tk = await token();
  if (tk) headers.Authorization = 'Bearer ' + tk;
  let r;
  try { r = await fetch(url, { headers }); }
  catch { throw new Error('連不上 TDX，請檢查網路'); }
  if (r.status === 429) throw new Error(tk ? 'TDX 查詢太頻繁，請稍後再試' : '今天的免費查詢次數用完了，到「設定」填入 TDX 金鑰就能繼續查');
  if (r.status === 401 || r.status === 403) { del('tok'); throw new Error('TDX 拒絕查詢（' + r.status + '），請到設定檢查金鑰'); }
  if (!r.ok) throw new Error('TDX 查詢失敗（' + r.status + '）');
  return r.json();
}
// 同一天的時刻表存在手機，重開不會再用掉查詢次數
async function cached(key, ttlMs, fn) {
  const c = get('c_' + key, null);
  if (c && c.exp > Date.now()) return c.v;
  const v = await fn();
  put('c_' + key, { exp: Date.now() + ttlMs, v });
  return v;
}
function purgeCache() {
  const today = fmt(new Date());
  try {
    Object.keys(localStorage).forEach(k => {
      if (!k.startsWith(LS + 'c_')) return;
      const m = k.match(/(\d{4}-\d{2}-\d{2})/);
      if (m && m[1] < today) localStorage.removeItem(k);
    });
  } catch {}
}

async function traStations() {
  if (DEMO) return DEMO_TRA.map(([n, c], i) => ({ id: String(1000 + i), name: n, city: norm(c) }));
  return cached('traSt2', 30 * 864e5, async () => {
    const j = await tdx('/v3/Rail/TRA/Station');
    const arr = Array.isArray(j) ? j : (j.Stations || []);
    return arr.map(s => ({ id: s.StationID, name: s.StationName && s.StationName.Zh_tw,
      city: norm(s.LocationCity || (s.StationAddress || '').replace(/^\d+/, '').slice(0, 3)) })).filter(s => s.id && s.name);
  });
}

// 高鐵某日起訖時刻 → [{no, dep, arr}]
async function thsrOD(o, d, date) {
  if (DEMO) return demoThsr(o, d);
  return cached(`thsr_${o}_${d}_${date}`, 6 * 3600e3, async () => {
    const j = await tdx(`/v2/Rail/THSR/DailyTimetable/OD/${o}/to/${d}/${date}`);
    const arr = Array.isArray(j) ? j : (j.DailyTimetables || j.TrainTimetables || []);
    return arr.map(t => ({
      no: (t.DailyTrainInfo || t.TrainInfo || {}).TrainNo,
      dep: (t.OriginStopTime || {}).DepartureTime,
      arr: (t.DestinationStopTime || {}).ArrivalTime
    })).filter(t => t.dep && t.arr).sort((a, b) => toMin(a.dep) - toMin(b.dep));
  });
}

// 台鐵某日起訖時刻 → [{no, type, dep, arr}]
async function traOD(o, d, date) {
  if (DEMO) return demoTra(o, d);
  return cached(`tra_${o}_${d}_${date}`, 6 * 3600e3, async () => {
    const j = await tdx(`/v3/Rail/TRA/DailyTrainTimetable/OD/${o}/to/${d}/${date}`);
    const arr = Array.isArray(j) ? j : (j.TrainTimetables || []);
    return arr.map(t => {
      const info = t.TrainInfo || t.DailyTrainInfo || {};
      const st = t.StopTimes || [];
      const so = st.find(s => s.StationID === o) || st[0] || t.OriginStopTime || {};
      const sd = st.find(s => s.StationID === d) || st[st.length - 1] || t.DestinationStopTime || {};
      const tn = info.TrainTypeName;
      return { no: info.TrainNo, type: (tn && (tn.Zh_tw || tn)) || '', dep: so.DepartureTime, arr: sd.ArrivalTime };
    }).filter(t => t.dep && t.arr).sort((a, b) => toMin(a.dep) - toMin(b.dep));
  });
}
const isLocal = type => /區間/.test(type);
const shortType = type => String(type).replace(/\(.*?\)|（.*?）/g, '').replace(/號$/, '').trim() || '台鐵';

// ---------- 畫面 ----------
function show(id) { ['view', 'setup'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }
function setStatus(msg, err) { const el = $('status'); el.textContent = msg || ''; el.classList.toggle('err', !!err); }

const thName = id => (THSR.find(s => s[0] === id) || [, id])[1];
// 目前方向的路線：{traFrom, traTo, thFrom, thTo}
function leg(dir) {
  const g = cfg.go;
  if (dir === 'go') return g;
  if (cfg.sameBack) return { thFrom: g.thTo, thTo: g.thFrom, traFrom: g.traTo, traTo: g.traFrom };
  return cfg.back;
}

function renderTop() {
  const L = leg(state.dir);
  const tra = `<b>${esc(L.traFrom.name)}</b> <span>區間→</span> <b>${esc(L.traTo.name)}</b>`;
  const th = `<span>高鐵</span> <b>${esc(thName(L.thFrom))}</b> <span>→</span> <b>${esc(thName(L.thTo))}</b>`;
  $('routeTxt').innerHTML = state.dir === 'go' ? tra + '<br>' + th : th + '<br>' + tra;
  [...$('dirSeg').children].forEach(b => b.classList.toggle('on', b.dataset.dir === state.dir));
}

let seq = 0;
const nowHM = () => { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); };
function resetQuery() { $('qDate').value = fmt(new Date()); $('qTime').value = nowHM(); }
function clearResult(msg) {
  seq++; state.th = state.tr = null;
  $('list').innerHTML = ''; $('btnEarlier').classList.add('hidden');
  setStatus(msg || '選好日期和高鐵出發時間，按「查詢」');
}
async function load() {
  renderTop();
  const my = ++seq;
  $('list').innerHTML = '';
  $('btnEarlier').classList.add('hidden');
  setStatus('查詢中…');
  const date = $('qDate').value || fmt(new Date());
  const L = leg(state.dir);
  try {
    let [th, tr] = await Promise.all([thsrOD(L.thFrom, L.thTo, date), traOD(L.traFrom.id, L.traTo.id, date)]);
    if (my !== seq) return;
    if (cfg.localOnly) tr = tr.filter(t => isLocal(t.type));
    state.th = th; state.tr = tr; state.open = {};
    state.nowMin = date === fmt(new Date()) ? toMin(nowHM()) : -1;
    state.from = toMin($('qTime').value || '00:00');
    state.autoOpen = true;
    render();
  } catch (e) {
    if (my !== seq) return;
    setStatus(e.message || String(e), true);
  }
}

// 某班高鐵對應的台鐵：去程取抵達夠早的最後 n 班（由晚到早），回程取之後的前 n 班
function traFor(t, n) {
  const buf = +cfg.buf || 0, tr = state.tr;
  if (state.dir === 'go') {
    const ok = tr.filter(r => toMin(r.arr) <= toMin(t.dep) - buf);
    return { list: ok.slice(-n).reverse(), more: ok.length > n };
  }
  const ok = tr.filter(r => toMin(r.dep) >= toMin(t.arr) + buf);
  return { list: ok.slice(0, n), more: ok.length > n };
}

function render() {
  const th = state.th, nowMin = state.nowMin;
  const buf = +cfg.buf || 0;
  const go = state.dir === 'go';
  const L = leg(state.dir);
  if (!th.length) { setStatus('這天查不到高鐵班次'); return; }
  const list = th.filter(t => toMin(t.dep) >= state.from);
  $('btnEarlier').classList.toggle('hidden', !(state.from > 0 && th.some(t => toMin(t.dep) < state.from)));
  setStatus(`高鐵 ${list.length} 班・轉乘預留 ${buf} 分鐘` + (cfg.localOnly ? '・只看區間車' : ''));
  if (state.autoOpen && list.length) { state.open[list[0].no + list[0].dep] = 2; state.autoOpen = false; }
  const labels = go ? ['最晚', '前一班'] : ['最快', '下一班'];
  $('list').innerHTML = list.map(t => {
    const key = t.no + t.dep, n = state.open[key] || 0;
    const dep = toMin(t.dep), arr = toMin(t.arr);
    const past = nowMin >= 0 && dep < nowMin;
    let body = '';
    if (n) {
      const { list: pick, more } = traFor(t, n);
      let rows = pick.map((r, i) => {
        const gone = nowMin >= 0 && toMin(r.dep) < nowMin;
        const wait = go ? dep - toMin(r.arr) : toMin(r.dep) - arr;
        return `<div class="tr${gone ? ' gone' : ''}"><span class="lbl">${labels[i] || (go ? '前' : '後') + i + '班'}</span>`
          + `<span class="t">${r.dep}</span><span class="s">→</span><span class="t">${r.arr}</span>`
          + `<span class="s">${esc(shortType(r.type))} ${esc(r.no || '')}</span>`
          + `<span class="w">等 ${wait} 分</span></div>`;
      });
      // 去程照搭車順序：早的在上，最晚那班緊接著高鐵
      if (go) rows.reverse();
      rows = rows.length ? rows.join('') : `<div class="tr none">${go ? '沒有來得及的區間車' : '之後沒有區間車了'}</div>`;
      const head = `<div class="row" style="margin-bottom:2px"><span class="tag tra">${go ? '先搭' : '再搭'}</span><span class="s" style="font-size:13px;color:var(--muted)">${esc(L.traFrom.name + ' → ' + L.traTo.name)}</span></div>`;
      const btn = more ? `<button class="addmore" data-more="${esc(key)}">${go ? '▲ 再顯示前兩班' : '▼ 再顯示後兩班'}</button>` : '';
      body = go ? `<div class="tras up">${head}${btn}${rows}</div>` : `<div class="tras">${head}${rows}${btn}</div>`;
    }
    const thBtn = `<button class="throw" data-key="${esc(key)}"><div class="row"><span class="tag thsr">${go && n ? '再轉' : '高鐵'}</span><span class="thsrline">${t.dep} → ${t.arr}</span><span class="chev">${n ? '收起' : '看台鐵'}</span></div>`
      + `<div class="sub">高鐵 ${esc(thName(L.thFrom) + ' → ' + thName(L.thTo))}・${esc(t.no || '')} 車次・${arr - dep} 分鐘</div></button>`;
    return `<div class="card${past ? ' past' : ''}">` + (go ? body + thBtn : thBtn + body) + `</div>`;
  }).join('') || '<div class="card">這個時間之後沒有高鐵了，可以把時間調早或換日期。</div>';
}
$('list').onclick = e => {
  const m = e.target.closest('[data-more]');
  if (m) { state.open[m.dataset.more] += 2; render(); return; }
  const r = e.target.closest('[data-key]');
  if (r) { const k = r.dataset.key; if (state.open[k]) delete state.open[k]; else state.open[k] = 2; render(); }
};

// ---------- 設定 ----------
const PICK = ['gTraFrom', 'gTraTo', 'bTraFrom', 'bTraTo'];
const THSEL = ['gThFrom', 'gThTo', 'bThFrom', 'bThTo'];
// 縣市由北到南排
const CITY_ORDER = ['基隆市','台北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣'];
const cityRank = c => { const i = CITY_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const cityOf = s => s.city || '其他';
function setPick(p, id) {
  const stn = traSt.find(s => s.id === id);
  $(p + 'C').value = stn ? cityOf(stn) : '';
  fillStations(p, id);
}
function fillStations(p, id) {
  const c = $(p + 'C').value;
  const list = traSt.filter(s => cityOf(s) === c);
  $(p + 'S').innerHTML = '<option value="">' + (c ? '選車站' : '先選縣市') + '</option>'
    + list.map(s => `<option value="${esc(s.id)}">${esc(norm(s.name))}</option>`).join('');
  $(p + 'S').value = id && list.some(s => s.id === id) ? id : '';
}
function getPick(p) { const s = traSt.find(x => x.id === $(p + 'S').value); return s ? { id: s.id, name: norm(s.name) } : null; }
// 選了高鐵站，自動帶入對應的台鐵轉乘站
function autoPair(thSel, pick) {
  const x = XFER.find(x => x[0] === thName($(thSel).value));
  const stn = x && traSt.find(s => norm(s.name) === norm(x[1]));
  if (stn) setPick(pick, stn.id);
}
PICK.forEach(p => { $(p + 'C').onchange = () => fillStations(p, ''); });
THSEL.forEach(id => { $(id).innerHTML = THSR.map(([v, n]) => `<option value="${v}">${n}</option>`).join(''); });
$('gThFrom').onchange = () => autoPair('gThFrom', 'gTraTo');
$('bThTo').onchange = () => autoPair('bThTo', 'bTraFrom');
$('sSame').onchange = () => {
  const same = $('sSame').checked;
  $('backBox').classList.toggle('hidden', same);
  if (same || !traSt.length) return;
  // 改成分開設定時，先用去程反過來當起點
  $('bThFrom').value = $('gThTo').value; $('bThTo').value = $('gThFrom').value;
  setPick('bTraFrom', $('gTraToS').value); setPick('bTraTo', $('gTraFromS').value);
};

let traSt = [];
async function openSetup(first) {
  show('setup');
  $('btnCancel').classList.toggle('hidden', !!first);
  const c = cfg || { go: { thFrom: '1040', thTo: '1000' }, sameBack: true, buf: 10, localOnly: true };
  const g = c.go, b = c.back || {};
  $('gThFrom').value = g.thFrom; $('gThTo').value = g.thTo;
  $('bThFrom').value = b.thFrom || g.thTo; $('bThTo').value = b.thTo || g.thFrom;
  $('sSame').checked = c.sameBack !== false;
  $('backBox').classList.toggle('hidden', $('sSame').checked);
  $('sBuf').value = c.buf;
  $('sLocal').checked = !!c.localOnly;
  $('sCid').value = c.cid || '';
  $('sSec').value = c.sec || '';
  const st = $('setStatus');
  st.classList.remove('err');
  PICK.forEach(p => { $(p + 'C').innerHTML = '<option>讀取中…</option>'; $(p + 'S').innerHTML = ''; });
  if (!traSt.length) {
    st.textContent = '讀取台鐵車站…';
    try { traSt = await traStations(); st.textContent = ''; }
    catch (e) { st.textContent = e.message; st.classList.add('err'); return; }
  }
  const cities = [...new Set(traSt.map(cityOf))].sort((a, b) => cityRank(a) - cityRank(b) || a.localeCompare(b));
  const opts = '<option value="">選縣市</option>' + cities.map(x => `<option>${esc(x)}</option>`).join('');
  PICK.forEach(p => { $(p + 'C').innerHTML = opts; });
  const id = o => o && o.id;
  setPick('gTraFrom', id(g.traFrom));
  setPick('bTraTo', id(b.traTo) || id(g.traFrom));
  if (g.traTo) setPick('gTraTo', g.traTo.id); else autoPair('gThFrom', 'gTraTo');
  if (b.traFrom) setPick('bTraFrom', b.traFrom.id); else setPick('bTraFrom', id(g.traTo) || $('gTraToS').value);
}

$('btnSave').onclick = async () => {
  const st = $('setStatus'); st.classList.add('err');
  const c = { cid: $('sCid').value.trim(), sec: $('sSec').value.trim() };
  if (c.cid && !c.sec || !c.cid && c.sec) { st.textContent = 'Client Id 和 Secret 要一起填'; $('keyBox').open = true; return; }
  const keyChanged = !cfg || cfg.cid !== c.cid || cfg.sec !== c.sec;
  if (keyChanged) { del('tok'); cfg = Object.assign({}, cfg, c); }
  if (!traSt.length) { await openSetup(!cfg || !cfg.go); return; }
  const go = { traFrom: getPick('gTraFrom'), traTo: getPick('gTraTo'), thFrom: $('gThFrom').value, thTo: $('gThTo').value };
  const sameBack = $('sSame').checked;
  const back = { thFrom: $('bThFrom').value, thTo: $('bThTo').value, traFrom: getPick('bTraFrom'), traTo: getPick('bTraTo') };
  const check = (L, name) => {
    if (!L.traFrom || !L.traTo) return name + '的台鐵上、下車站要選好';
    if (L.traFrom.id === L.traTo.id) return name + '的台鐵上、下車站不能一樣';
    if (L.thFrom === L.thTo) return name + '的高鐵起訖站不能一樣';
    return '';
  };
  const err = check(go, '去程') || (sameBack ? '' : check(back, '回程'));
  if (err) { st.textContent = err; return; }
  cfg = Object.assign(c, { v: 2, go, back: sameBack ? null : back, sameBack,
    buf: Math.max(0, Math.min(60, parseInt($('sBuf').value, 10) || 0)), localOnly: $('sLocal').checked });
  put('cfg', cfg);
  st.textContent = '';
  show('view'); clearResult();
};
$('btnCancel').onclick = () => { show('view'); };
$('btnSet').onclick = () => openSetup(false);
$('dirSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.dir = b.dataset.dir; put('dir', state.dir); renderTop(); if (state.th) load(); else clearResult(); };
$('btnQuery').onclick = () => load();
// 往前一小時
$('btnEarlier').onclick = () => {
  state.from = Math.max(0, state.from - 60);
  $('qTime').value = String(Math.floor(state.from / 60)).padStart(2, '0') + ':' + String(state.from % 60).padStart(2, '0');
  render();
};
// 回到 App 時更新（已開走的班次變灰）
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !cfg || !cfg.go || $('view').classList.contains('hidden')) return;
  // 隔了一段時間回來：沒查過就把時間更新成現在
  if (!state.th) resetQuery();
});

// ---------- 測試用假資料（網址加 ?demo） ----------
const DEMO_TRA = [['豐原', '臺中市'], ['潭子', '臺中市'], ['臺中', '臺中市'], ['大慶', '臺中市'], ['新烏日', '臺中市'], ['烏日', '臺中市'], ['彰化', '彰化縣'], ['員林', '彰化縣'], ['臺北', '臺北市'], ['南港', '臺北市'], ['板橋', '新北市'], ['六家', '新竹縣'], ['豐富', '苗栗縣'], ['沙崙', '臺南市'], ['新左營', '高雄市'], ['基隆', '基隆市']];
function demoThsr() { const a = []; for (let m = 6 * 60 + 15; m < 23 * 60; m += 30 + (m % 7)) a.push({ no: String(600 + a.length * 2), dep: hm(m), arr: hm(m + 48 + (a.length % 3) * 10) }); return a; }
function demoTra() { const a = []; for (let m = 5 * 60 + 40; m < 23 * 60 + 30; m += 13 + (m % 11)) a.push({ no: String(2100 + a.length * 2), type: a.length % 5 === 3 ? '自強(3000)' : (a.length % 4 === 1 ? '區間快' : '區間'), dep: hm(m), arr: hm(m + 22) }); return a; }
function hm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

// ---------- 開始 ----------
purgeCache();
// 舊版設定（單一路線）轉成去程，回程反過來
if (cfg && !cfg.go && cfg.homeId) {
  const thId = (THSR.find(x => x[1] === cfg.xferThsr) || [])[0];
  cfg = { v: 2, cid: cfg.cid, sec: cfg.sec, buf: cfg.buf, localOnly: cfg.localOnly, sameBack: true, back: null,
    go: { traFrom: { id: cfg.homeId, name: cfg.homeName }, traTo: { id: cfg.xferTraId, name: cfg.xferTraName }, thFrom: thId, thTo: cfg.destId } };
  put('cfg', cfg);
}
resetQuery();
if (cfg && cfg.go) { show('view'); renderTop(); clearResult(); }
else openSetup(true);
})();
</script>
