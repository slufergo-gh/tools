<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1418">
<meta name="apple-mobile-web-app-title" content="流動畫">
<title>流動畫</title>
<style>
:root{--bg:#0f1418;--panel:rgba(20,27,33,.92);--line:#2a3640;--fg:#e9eef2;--muted:#8a99a6;--accent:#4aa3ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none}
#stage{flex:1;position:relative;min-height:0;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#bar{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.row{display:flex;align-items:center;gap:8px;min-width:0}
#sw{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px;scrollbar-width:none}
#sw::-webkit-scrollbar{display:none}
.sw{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.3);padding:0;cursor:pointer}
.sw.on{outline:3px solid #fff;outline-offset:2px}
.sw.rot{background:conic-gradient(#f55,#fc5,#5c7,#4af,#a6f,#f55)}
button{font:inherit;color:inherit}
.btn{background:transparent;border:0;border-radius:12px;min-width:40px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0 4px;color:var(--fg)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn small{font-size:10px;color:var(--muted)}
.btn:active{background:rgba(255,255,255,.08)}
.btn:disabled{opacity:.35}
.tool.on{background:var(--accent);color:#fff}
.tool.on small{color:#fff}
.spacer{flex:1}
#size{width:96px;accent-color:var(--accent)}
.sizewrap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
/* 電腦版：左側直欄 */
body.pc{flex-direction:row-reverse}
body.pc #bar{width:92px;border-top:0;border-left:0;border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto}
body.pc .row{flex-direction:column}
body.pc #sw{flex-direction:column;overflow-x:visible;overflow-y:auto;flex:none;max-height:none;align-items:center}
body.pc .sizewrap{flex-direction:column}
body.pc #size{width:72px}
body.pc .spacer{display:none}
/* 面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));z-index:10;user-select:auto}
body.pc .sheet{left:auto;top:0;width:360px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line)}
.sheet header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;background:inherit}
.sheet header b{font-size:18px}
.sheet h3{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 8px}
.done{background:var(--accent);border:0;border-radius:10px;padding:8px 16px;color:#fff;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;width:46px;height:46px}
.chip label{display:block;width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;overflow:hidden}
.chip input{opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.chip .del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.add{width:46px;height:46px;border-radius:50%;border:2px dashed var(--muted);background:transparent;font-size:24px;color:var(--muted);cursor:pointer}
.pair{display:flex;gap:16px;margin-top:6px}
.pair .item{display:flex;align-items:center;gap:8px;font-size:14px}
.tpl{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:left}
.tpl.on{border-color:var(--accent)}
.tpl .bars{display:flex;flex:1;height:22px;border-radius:6px;overflow:hidden}
.tpl .bars i{flex:1}
.tpl span{width:76px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:14px 4px;cursor:pointer;font-size:14px}
.set{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.set label{width:84px;flex:none}
.set input[type=range]{flex:1;accent-color:var(--accent)}
.set select{flex:1;background:#1c252c;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
.tip{font-size:12px;color:var(--muted);line-height:1.6}
#hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;
  max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:opacity .6s}
#fail[hidden]{display:none}
#fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);z-index:20;line-height:1.7}
[hidden]{display:none!important}
.row.tools{gap:4px}
.sheet{z-index:30}
.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,163,255,.8)}50%{box-shadow:0 0 0 9px rgba(74,163,255,0)}}
/* 開始畫面 */
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(8,12,16,.35),rgba(8,12,16,.8));overflow-y:auto}
#start[hidden]{display:none}
.startbox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.startbox h1{font-size:40px;margin:0;letter-spacing:4px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.startbox>p{margin:0 0 12px;color:#cfd8df;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.startbox h2{font-size:20px;margin:4px 0}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(20,27,33,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font-size:18px;font-weight:600}
.big small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px}
.big img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.big:active{border-color:var(--accent)}
.big.primary{border-color:var(--accent)}
.link{background:none;border:0;color:#cfd8df;font-size:15px;padding:10px;cursor:pointer;text-decoration:underline}
.lesson{background:rgba(20,27,33,.9);border:1px solid var(--line);border-radius:16px;padding:14px}
.lesson b{font-size:17px}
.lesson p{margin:6px 0 10px;font-size:13px;color:var(--muted);line-height:1.6}
.lesson .acts{display:flex;gap:8px;flex-wrap:wrap}
.lesson .acts button{flex:1;min-width:120px;background:var(--accent);border:0;border-radius:10px;padding:10px;color:#fff;cursor:pointer;font-size:14px}
.lesson .acts button.alt{background:#2a3640}
/* 教學卡片 */
#coach{position:absolute;left:10px;right:10px;top:10px;margin:0 auto;max-width:520px;background:rgba(20,27,33,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;z-index:5;font-size:15px;line-height:1.6;pointer-events:none;transition:opacity .25s}
#coach button{pointer-events:auto}
body.drawing #coach{opacity:.25}
body.drawing #coach button{pointer-events:none}
#coach[hidden]{display:none}
#coach .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
#coach .bar{height:5px;background:#2a3640;border-radius:3px;margin:8px 0 2px;overflow:hidden}
#coach .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#coach .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#coach .acts button{border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:14px;background:#2a3640;color:var(--fg)}
#coach .acts button.next{background:var(--accent);color:#fff}
#coach .acts button.next:disabled{opacity:.4}
#coach .good{color:#7ee2a8}
/* 傾斜箭頭 */
#tiltUI{position:absolute;pointer-events:none;z-index:4}
#tiltUI[hidden]{display:none}
#tiltUI .dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
#tiltUI .arm{position:absolute;left:0;top:-2px;height:4px;background:#fff;border-radius:2px;transform-origin:0 50%;box-shadow:0 0 6px rgba(0,0,0,.5)}
#tiltUI .arm::after{content:"";position:absolute;right:-10px;top:-6px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
/* 作品列表 */
.work{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.work img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.work .meta{flex:1;font-size:14px;line-height:1.5}
.work .meta small{color:var(--muted)}
.work button{background:#2a3640;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.work button.load{background:var(--accent);color:#fff}
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tplgrid button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 4px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hint" hidden></div>
  <div id="tiltUI" hidden><div class="arm"></div><div class="dot"></div></div>
  <div id="coach" hidden>
    <div class="top"><span id="coachStep"></span><span id="coachName"></span></div>
    <div id="coachText"></div>
    <div class="bar" id="coachBar"><i></i></div>
    <div class="acts"><button id="coachQuit">結束教學</button><button class="next" id="coachNext">下一步</button></div>
  </div>
</div>

<div id="bar">
  <div class="row">
    <div id="sw"></div>
    <div class="sizewrap"><span>筆刷</span><input id="size" type="range" min="0.02" max="0.25" step="0.005" value="0.07" aria-label="筆刷大小"></div>
  </div>
  <div class="row tools">
    <button class="btn tool on" data-tool="pour" title="倒顏料 (P)"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg><small>倒</small></button>
    <button class="btn tool" data-tool="blow" title="吹風 (B，滑鼠右鍵也是吹風)"><svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><small>吹</small></button>
    <button class="btn tool" data-tool="tilt" title="傾斜畫布 (T)：往一個方向拖，顏料就往那邊流"><svg viewBox="0 0 24 24"><path d="M3 17 21 9"/><path d="M15 6l6 3-3 6"/><path d="M5 21h14"/></svg><small>傾斜</small></button>
    <span class="spacer"></span>
    <button class="btn" id="bUndo" title="復原 (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><small>復原</small></button>
    <button class="btn" id="bTpl" title="一鍵構圖"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><small>構圖</small></button>
    <button class="btn" id="bPal" title="配色"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><small>配色</small></button>
    <button class="btn" id="bSet" title="設定"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><small>設定</small></button>
    <button class="btn" id="bFile" title="暫存、讀檔、存圖"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><small>檔案</small></button>
  </div>
</div>

<div class="sheet" id="tplSheet" hidden>
  <header><b>選擇構圖</b><button class="done" data-close>關閉</button></header>
  <p class="tip">選一個起手式，畫布會用目前的配色先倒好顏料，再用「吹」和「傾斜」把它變成你的作品。想換顏色可以先到「配色」。</p>
  <div id="tplGroups"></div>
</div>

<div class="sheet" id="fileSheet" hidden>
  <header><b>檔案</b><button class="done" data-close>完成</button></header>
  <div class="grid">
    <button id="fSave">暫存</button>
    <button id="fExport">存成圖片</button>
    <button id="fHome">開始畫面</button>
  </div>
  <h3>我的作品</h3>
  <p class="tip" style="margin-top:0">作品暫存在這台裝置的瀏覽器裡，換手機或清除瀏覽資料就會不見；想永久保留請「存成圖片」。</p>
  <div id="works"></div>
</div>

<div class="sheet" id="palSheet" hidden>
  <header><b>配色</b><button class="done" data-close>完成</button></header>
  <h3>目前的顏料（點一下改顏色）</h3>
  <div class="chips" id="curCols"></div>
  <div class="pair">
    <div class="item"><div class="chip"><label id="canvasLbl"><input type="color" id="canvasCol"></label></div>畫布</div>
    <div class="item"><div class="chip"><label id="laceLbl"><input type="color" id="laceCol"></label></div>泡沫</div>
  </div>
  <h3>配色模板（選了之後還可以再調）</h3>
  <div id="tplList"></div>
</div>

<div class="sheet" id="setSheet" hidden>
  <header><b>設定</b><button class="done" data-close>完成</button></header>
  <h3>顏料</h3>
  <div class="set"><label>黏稠度</label><input type="range" data-k="viscosity" min="0.3" max="6" step="0.1"></div>
  <div class="set"><label>攤開速度</label><input type="range" data-k="spread" min="0" max="80" step="1"></div>
  <div class="set"><label>風力</label><input type="range" data-k="blow" min="0.2" max="3" step="0.1"></div>
  <div class="set"><label>捲曲</label><input type="range" data-k="curl" min="0" max="40" step="1"></div>
  <h3>效果</h3>
  <div class="set"><label>泡沫蕾絲</label><input type="range" data-k="foam" min="0" max="1" step="0.05"></div>
  <div class="set"><label>細胞</label><input type="range" data-k="cells" min="0" max="1" step="0.05"></div>
  <div class="set"><label>立體感</label><input type="range" data-k="relief" min="0" max="25" step="0.5"></div>
  <div class="set"><label>光澤</label><input type="range" data-k="gloss" min="0" max="1.5" step="0.05"></div>
  <h3>其他</h3>
  <div class="set"><label>畫質</label><select data-k="quality"><option value="low">省電</option><option value="std">標準</option><option value="high">高畫質</option></select></div>
  <div class="set"><label>介面</label><select data-k="layout"><option value="auto">自動</option><option value="phone">手機</option><option value="pc">電腦</option></select></div>
  <div class="set"><label>傾斜手機</label><select data-k="tilt"><option value="off">關閉</option><option value="on">開啟（傾斜讓顏料流動）</option></select></div>
  <p class="tip">電腦操作：左鍵用目前工具、右鍵吹風、滾輪調筆刷大小、P 倒、B 吹、T 傾斜、Ctrl+Z 復原。<br>畫面卡頓時把畫質調成「省電」。</p>
  <div class="set"><button class="done" id="resetSet" style="background:#333">恢復預設</button></div>
</div>

<div id="start" hidden>
  <div class="startbox">
    <h1>流動畫</h1>
    <p>倒顏料、吹風、傾斜畫布，做出屬於你的流體畫</p>
    <div id="startMain" style="display:flex;flex-direction:column;gap:12px">
      <button class="big primary" id="sContinue" hidden><img alt=""><span>繼續上次的作品<small></small></span></button>
      <button class="big" data-start="tpl"><span>從構圖開始<small>海浪、同心圓、大理石…選一個起手式再自由發揮</small></span></button>
      <button class="big" data-start="blank"><span>空白畫布<small>從零開始，自己倒、自己吹</small></span></button>
      <button class="big" data-start="lesson"><span>教學課程<small>像上體驗課一樣，跟著步驟做出自己的第一幅</small></span></button>
      <button class="link" data-start="works">我的作品</button>
    </div>
    <div id="startLessons" hidden style="display:flex;flex-direction:column;gap:12px">
      <h2>教學課程</h2>
      <div id="lessonList" style="display:flex;flex-direction:column;gap:10px"></div>
      <button class="link" data-start="back">返回</button>
    </div>
  </div>
</div>

<div id="fail" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem('fluidart.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('fluidart.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 配色模板 ---------- */
const PALETTES = [
  {name:'海洋', canvas:'#e8d9bd', lace:'#ffffff', colors:['#0b2545','#13426b','#1b6f9e','#2bb3c0','#7fdcd6','#ffffff']},
  {name:'熱帶海灣', canvas:'#f3e6c8', lace:'#ffffff', colors:['#004e64','#00a5cf','#25a18e','#7ae582','#ffffff']},
  {name:'夕陽海', canvas:'#1d1230', lace:'#fff4e0', colors:['#2b1a3a','#7b2d5b','#e0475e','#f79d65','#ffd29d','#ffffff']},
  {name:'大理石金', canvas:'#f4f1ec', lace:'#ffffff', colors:['#111111','#3a3a3a','#d4af37','#c9c4ba','#ffffff']},
  {name:'銀河', canvas:'#05050f', lace:'#e8f4ff', colors:['#0b0b2b','#3a0ca3','#7209b7','#f72585','#4cc9f0','#ffffff']},
  {name:'粉彩', canvas:'#fff8f0', lace:'#ffffff', colors:['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff']},
  {name:'莫蘭迪', canvas:'#e9e4dc', lace:'#ffffff', colors:['#6b705c','#8e9aaf','#a3b18a','#cbc0d3','#efd3d7','#ffffff']},
  {name:'火焰', canvas:'#120a05', lace:'#fff3c4', colors:['#370617','#9d0208','#dc2f02','#f48c06','#ffba08','#ffffff']},
  {name:'森林湖', canvas:'#e4e1d3', lace:'#ffffff', colors:['#081c15','#1b4332','#2d6a4f','#52b788','#b7e4c7','#ffffff']},
  {name:'珊瑚礁', canvas:'#fdf0e6', lace:'#ffffff', colors:['#118ab2','#06d6a0','#ffd166','#ff8e72','#ff6b6b','#ffffff']},
  {name:'黑白金', canvas:'#000000', lace:'#ffffff', colors:['#000000','#5c5c5c','#bfa15a','#ffffff']},
  {name:'薰衣草', canvas:'#f6f2fb', lace:'#ffffff', colors:['#3c2a4d','#6d597a','#b56576','#e3b5d4','#c8b6ff','#ffffff']},

void main(){ vUv=aPos*.5+.5; vL=vUv-vec2(texelSize.x,0.); vR=vUv+vec2(texelSize.x,0.);

precision highp float; precision highp sampler2D;
in vec2 vUv,vL,vR,vT,vB; out vec4 o;
`;
function program(src){
  const p = gl.createProgram();
  gl.attachShader(p, VS); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEAD + src));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i = 0; i < n; i++){ const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }

vec2 hash2(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash2(i).x, b=hash2(i+vec2(1,0)).x, c=hash2(i+vec2(0,1)).x, d=hash2(i+vec2(1,1)).x;
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float voro(vec2 x){ vec2 n=floor(x), f=fract(x); float f1=8., f2=8.;

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

function blit(t){
  if(t){ gl.viewport(0, 0, t.w, t.h); gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); }
  else { gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
}
function makeFBO(w, h, eight){
  const tex = gl.createTexture();

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, eight ? gl.RGBA8 : gl.RGBA16F, w, h, 0, gl.RGBA, eight ? gl.UNSIGNED_BYTE : gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return {tex, fbo, w, h, tx:1/w, ty:1/h,
    bind(i){ gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); return i; },
    free(){ gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); }};

function makeDouble(w, h){

  return {w, h, tx:1/w, ty:1/h, get read(){ return a; }, get write(){ return b; }, swap(){ [a, b] = [b, a]; }, free(){ a.free(); b.free(); }};
}

const QUALITY = {low:{sim:128, dye:640}, std:{sim:176, dye:1024}, high:{sim:240, dye:1536}};
let vel, flow, dye, aux, pres, divF, curlF, aspect = 1, simKey = '';
function resolution(r){
  let a = canvas.width / canvas.height; const inv = a < 1; if(inv) a = 1 / a;
  const mn = Math.round(r), mx = Math.round(r * a);
  return canvas.width > canvas.height ? {w:mx, h:mn} : {w:mn, h:mx};
}
function copyTo(src, dst, mode = 0, scale = [1,1,1,1]){
  const u = P.copy.use();
  gl.uniform2f(u.texelSize, src.tx, src.ty); gl.uniform1i(u.uT, src.bind(0));
  gl.uniform1i(u.uMode, mode); gl.uniform4fv(u.uScale, scale); blit(dst);
}
function setTo(dst, v){ const u = P.set.use(); gl.uniform4fv(u.uValue, v); blit(dst); }
function initSim(){
  const q = QUALITY[S.quality] || QUALITY.std;
  const sr = resolution(q.sim), dr = resolution(Math.min(q.dye, Math.max(canvas.width, canvas.height)));
  const key = [sr.w, sr.h, dr.w, dr.h].join('x');
  if(key === simKey) return;
  simKey = key; aspect = canvas.width / canvas.height;
  const old = dye ? {dye, aux} : null;
  if(vel){ vel.free(); flow.free(); pres.free(); divF.free(); curlF.free(); }
  vel = makeDouble(sr.w, sr.h); flow = makeDouble(sr.w, sr.h); pres = makeDouble(sr.w, sr.h);
  divF = makeFBO(sr.w, sr.h); curlF = makeFBO(sr.w, sr.h);
  dye = makeDouble(dr.w, dr.h); aux = makeDouble(dr.w, dr.h);
  setTo(aux.read, [1,0,0,1]);
  if(old){ copyTo(old.dye.read, dye.read); copyTo(old.aux.read, aux.read); old.dye.free(); old.aux.free(); }
  clearHistory();
}
function resize(){
  const st = $('#stage'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(st.clientWidth * dpr)), h = Math.max(1, Math.round(st.clientHeight * dpr));
  if(w !== canvas.width || h !== canvas.height){ canvas.width = w; canvas.height = h; }
  initSim();
}

/* ---------- 歷史（復原） ---------- */
const hist = []; const HMAX = 6;
function clearHistory(){ while(hist.length){ const s = hist.pop(); s.d.free(); s.a.free(); } updateUndo(); }
function snapshot(){
  let s = hist.length >= HMAX ? hist.shift() : null;
  if(!s) s = {d:makeFBO(dye.w, dye.h, true), a:makeFBO(dye.w, dye.h, true)};
  copyTo(dye.read, s.d, 1); copyTo(aux.read, s.a, 0, [1,1,1,1]);
  hist.push(s); updateUndo();
}
function undo(){
  const s = hist.pop(); if(!s) return;
  copyTo(s.d, dye.read, 2); copyTo(s.a, aux.read, 0, [1,1,1,1]);
  setTo(vel.read, [0,0,0,1]); setTo(pres.read, [0,0,0,1]);
  s.d.free(); s.a.free(); updateUndo();
}
function updateUndo(){ $('#bUndo').disabled = !hist.length; }
function clearCanvas(){ setTo(dye.read, [0,0,0,0]); setTo(aux.read, [1,0,0,1]); setTo(vel.read, [0,0,0,1]); setTo(pres.read, [0,0,0,1]); }

/* ---------- 繪製工具 ---------- */
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const lum = c => { const [r, g, b] = hex2rgb(c); return .3 * r + .59 * g + .11 * b; };
function paint(o){
  // o: {shape:0圓/1帶, x,y,r | y0,y1, color, add, seed, cell}
  const rgb = hex2rgb(o.color), foam = o.foam != null ? o.foam : lum(o.color) > .85 ? 1 : 0;
  for(const [t, mode] of [[dye, 0], [aux, 1]]){
    const u = P.paint.use();
    gl.uniform2f(u.texelSize, t.tx, t.ty); gl.uniform1i(u.uT, t.read.bind(0));
    gl.uniform1i(u.uMode, mode); gl.uniform1i(u.uShape, o.shape || 0);
    gl.uniform2f(u.uPoint, o.x || 0, o.y || 0); gl.uniform2f(u.uBand, o.y0 || 0, o.y1 || 0);
    gl.uniform3fv(u.uColor, rgb); gl.uniform1f(u.uR, o.r || .1); gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uAdd, o.add); gl.uniform1f(u.uSeed, o.seed); gl.uniform1f(u.uCell, o.cell); gl.uniform1f(u.uFoam, foam);
    gl.uniform1f(u.uAngle, o.angle || 0); gl.uniform1f(u.uCurve, o.curve || 0);
    blit(t.write); t.swap();
  }
}
function splatVel(x, y, fx, fy, r){
  const u = P.splat.use();
  gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uT, vel.read.bind(0));
  gl.uniform2f(u.uPoint, x, y); gl.uniform2f(u.uForce, fx, fy); gl.uniform1f(u.uR, r); gl.uniform1f(u.uAspect, aspect);
  blit(vel.write); vel.swap();
}
function radial(x, y, r, s, t = flow){
  const u = P.radial.use();
  gl.uniform2f(u.texelSize, t.tx, t.ty); gl.uniform1i(u.uT, t.read.bind(0));
  gl.uniform2f(u.uPoint, x, y); gl.uniform1f(u.uR, r); gl.uniform1f(u.uS, s); gl.uniform1f(u.uAspect, aspect);
  blit(t.write); t.swap();
}

/* ---------- 模擬 ---------- */
const pointers = new Map();
let tilt = [0, 0], tilt0 = null;
let DEAD = 1.5, THIN = .6;
let tiltUI = [0, 0];
const stats = {pour:0, blow:0, tilt:0};
function step(dt){
  gl.disable(gl.BLEND);
  const R = state.size;
  // 吹風：沿著拖曳方向的力（會產生漩渦）
  for(const p of pointers.values()){
    p.speed = Math.max(p.speed * .85, Math.hypot(p.dx, p.dy));
    if(p.tool === 'pour') stats.pour += dt;
    else if(p.tool === 'blow') stats.blow += Math.hypot(p.dx, p.dy) + dt * .15;
    if(p.tool === 'tilt' || !(p.dx || p.dy)) continue;
    const g = p.tool === 'blow' ? 2.2 * S.blow : 0.6;
    splatVel(p.x, p.y, p.dx * vel.w * g, p.dy * vel.h * g, R * (p.tool === 'blow' ? 1.4 : 0.8));
  }
  let u = P.curl.use(); gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uVel, vel.read.bind(0)); blit(curlF);
  u = P.vort.use(); gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uVel, vel.read.bind(0)); gl.uniform1i(u.uCurl, curlF.bind(1));
  gl.uniform1f(u.uCurlS, S.curl); gl.uniform1f(u.uDt, dt); blit(vel.write); vel.swap();
  u = P.div.use(); gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uVel, vel.read.bind(0)); blit(divF);
  copyTo(pres.read, pres.write, 0, [.8,.8,.8,1]); pres.swap();
  u = P.pressure.use(); gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uDiv, divF.bind(0));
  for(let i = 0; i < 20; i++){ gl.uniform1i(u.uP, pres.read.bind(1)); blit(pres.write); pres.swap(); }
  u = P.grad.use(); gl.uniform2f(u.texelSize, vel.tx, vel.ty); gl.uniform1i(u.uP, pres.read.bind(0)); gl.uniform1i(u.uVel, vel.read.bind(1));
  blit(vel.write); vel.swap();

  const top = Y(1) + .03 + Math.abs(curve) * .3, bottom = Y(shore), n = Math.max(cols.length, 1), hgt = (top - bottom) / n;
  const P2 = o => paint(Object.assign({shape:1, angle, curve, seed:rnd(0, 99), cell:rnd(35, 75)}, o));

    const r = indexedDB.open('fluidart', 1);

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('works', mode), req = fn(t.objectStore('works'));
      t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error);
    });
  }
  return {put:r => tx('readwrite', s => s.put(r)), get:id => tx('readonly', s => s.get(id)),
    all:() => tx('readonly', s => s.getAll()), del:id => tx('readwrite', s => s.delete(id))};

  render();
  const c = document.createElement('canvas'), k = 240 / Math.max(canvas.width, canvas.height);
  c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .75);
}
async function saveWork(id){
  const thumb = makeThumb();
  const a = makeFBO(dye.w, dye.h, true), b = makeFBO(dye.w, dye.h, true);
  pack(a, 0); pack(b, 1);
  const color = await fboToBlob(a), data = await fboToBlob(b);
  a.free(); b.free();
  await DB.put({id, workId:state.workId, time:Date.now(), palette:JSON.parse(JSON.stringify(pal)), color, data, thumb});
}
async function loadWork(id){
  const rec = await DB.get(id); if(!rec) return false;
  const c = await blobToFBO(rec.color), d = await blobToFBO(rec.data);
  snapshot();
  const u = P.unpack.use();
  gl.uniform2f(u.texelSize, c.tx, c.ty); gl.uniform1i(u.uC, c.bind(0)); gl.uniform1i(u.uD, d.bind(1));
  gl.uniform1i(u.uMode, 0); blit(dye.read); gl.uniform1i(u.uMode, 1); blit(aux.read);
  setTo(vel.read, [0,0,0,1]); setTo(pres.read, [0,0,0,1]);
  c.free(); d.free();
  pal = rec.palette; state.sel = -1; savePal(); renderSwatches();
  state.workId = id === 'auto' ? rec.workId || null : id;
  clearHistory();
  return true;
}
async function autosave(force){
  if((!dirty && !force) || saving || pointers.size || !started) return;
  saving = true; dirty = false;
  try{ await saveWork('auto'); }catch(e){ console.warn('autosave', e); }
  saving = false;
}
setInterval(autosave, 45000);
document.addEventListener('visibilitychange', () => { if(document.hidden) autosave(); });
addEventListener('pagehide', () => autosave());
const fmtTime = t => { const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
async function renderWorks(){
  const box = $('#works'); box.innerHTML = '<p class="tip">讀取中…</p>';
  let list = [];
  try{ list = await DB.all(); }catch(e){ box.innerHTML = '<p class="tip">這個瀏覽器無法暫存作品（可能是無痕模式）。</p>'; return; }
  list.sort((a, b) => (b.id === 'auto') - (a.id === 'auto') || b.time - a.time);
  box.innerHTML = list.length ? '' : '<p class="tip">還沒有暫存的作品。畫到一半按「暫存」就會出現在這裡。</p>';
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'work';
    row.innerHTML = `<img alt=""><div class="meta">${r.id === 'auto' ? '自動暫存' : '作品'}<br><small>${fmtTime(r.time)}${r.id === state.workId ? '・目前' : ''}</small></div><button class="load">讀取</button><button class="del">刪除</button>`;
    row.querySelector('img').src = r.thumb;
    row.querySelector('.load').onclick = async () => {
      if(dirty || hist.length) await autosave(true);
      if(await loadWork(r.id)){ $('#fileSheet').hidden = true; closeStart(); showHint('已讀取作品，可以繼續畫'); }
    };
    row.querySelector('.del').onclick = async () => {
      if(!confirm('確定刪除這個暫存的作品？')) return;
      await DB.del(r.id); if(state.workId === r.id) state.workId = null; renderWorks();
    };
    box.appendChild(row);
  });
}
$('#fSave').onclick = async () => {
  if(!state.workId) state.workId = 'w' + Date.now();
  try{ await saveWork(state.workId); await saveWork('auto'); dirty = false; showHint('已暫存，之後可以在「檔案」裡讀取'); renderWorks(); }
  catch(e){ showHint('暫存失敗：' + (e.message || e)); }
};
$('#fHome').onclick = async () => { $('#fileSheet').hidden = true; endLesson(); await autosave(true); openStart(); };

/* ---------- 開始畫面 ---------- */
async function openStart(){
  started = false; fromStart = true;
  $('#start').hidden = false; $('#startMain').hidden = false; $('#startLessons').hidden = true;
  const btn = $('#sContinue'); btn.hidden = true;
  try{
    const rec = await DB.get('auto');
    if(rec){ btn.hidden = false; btn.querySelector('img').src = rec.thumb; btn.querySelector('small').textContent = '上次畫到 ' + fmtTime(rec.time); }
  }catch(e){}
}
function closeStart(){ $('#start').hidden = true; started = true; fromStart = false; }
$('#sContinue').onclick = async () => { if(await loadWork('auto')) closeStart(); };
$$('[data-start]').forEach(b => b.onclick = () => {
  const k = b.dataset.start;
  if(k === 'tpl') openSheet('tplSheet');
  else if(k === 'blank'){ newWork(); clearCanvas(); closeStart(); setTool('pour'); dirty = true; showHint('選一個顏色，按住畫布倒顏料'); }
  else if(k === 'lesson'){ renderLessons(); $('#startMain').hidden = true; $('#startLessons').hidden = false; }
  else if(k === 'back'){ $('#startMain').hidden = false; $('#startLessons').hidden = true; }
  else if(k === 'works') openSheet('fileSheet');
});

/* ---------- 教學 ---------- */
const lumIdx = () => pal.colors.map((c, i) => [lum(c), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const paintIdx = () => lumIdx().filter(i => lum(pal.colors[i]) < .85);
function whiteIdx(){
  let i = pal.colors.findIndex(c => lum(c) > .85);
  if(i < 0){ pal.colors.push('#ffffff'); savePal(); i = pal.colors.length - 1; }
  return i;
}
function useColor(i){ state.sel = i; setTool('pour'); renderSwatches(); }
const sizeTo = v => { state.size = v; sizeEl.value = v; };
const S_PAL = {text:'先挑一組配色。下方會打開配色面板，點一組喜歡的模板，也可以再點顏色微調。選好按「下一步」。', before:() => openSheet('palSheet'), hl:'#bPal'};
const LESSONS = [
  {name:'海浪', desc:'倒出深淺不同的海，再用吹風把白色吹成浪花蕾絲。', tpl:'0-0', skip:5, steps:[
    S_PAL,
    {text:'先倒最深的海。已經幫你選好最深的顏色，在畫面<b>最上方</b>按住，左右慢慢拖，像畫一條粗線。', goal:['pour', 2.5],
      before:() => { $('#palSheet').hidden = true; const p = paintIdx(); useColor(p[0]); sizeTo(.09); }, hl:'.tool[data-tool=pour]'},
    {text:'接著倒中間的藍，緊貼在剛剛那條<b>下面</b>，一樣左右拖。', goal:['pour', 2.5], before:() => { const p = paintIdx(); useColor(p[Math.floor(p.length / 2)]); }},
    {text:'再倒淺色，越往下越淺，這裡會靠近海灘。', goal:['pour', 2], before:() => { const p = paintIdx(); useColor(p[p.length - 1]); }},
    {text:'最後倒白色當浪花，倒在淺色的<b>最下緣</b>，薄薄一條就好。', goal:['pour', 1.5], before:() => { useColor(whiteIdx()); sizeTo(.06); }},
    {text:'重頭戲來了！已切到「吹」。從白色<b>下方往上</b>（往海的方向）一小段一小段地拖，白色變薄的地方會長出蕾絲泡沫。', goal:['blow', 1.2],
      before:() => setTool('blow'), hl:'.tool[data-tool=blow]'},
    {text:'試試傾斜畫布：已切到「傾斜」，在畫面上<b>往上方</b>輕輕拖住，顏料就會往那邊流。放開就回到水平。', goal:['tilt', 1.5],
      before:() => setTool('tilt'), hl:'.tool[data-tool=tilt]'},
    {text:'想要更多泡沫或更立體？打開的設定裡可以調「泡沫蕾絲」和「立體感」。調好按「下一步」。', before:() => openSheet('setSheet'), hl:'#bSet'},
    {text:'完成了！這幅海浪是你獨一無二的作品。按「檔案」可以存成圖片，或暫存起來之後繼續修。', before:() => { $('#setSheet').hidden = true; }, hl:'#bFile'},
  ]},
  {name:'同心圓倒畫', desc:'在中央一直倒，顏料一圈圈長大，再傾斜畫布讓它流成花。', tpl:'1-0', skip:3, steps:[
    S_PAL,
    {text:'已選「輪流換色」（彩虹圓圈）。在畫布<b>中央按住不動</b>，顏料會一圈一圈長大，按住大約 6 秒。', goal:['pour', 5.5],
      before:() => { $('#palSheet').hidden = true; state.sel = -1; setTool('pour'); renderSwatches(); sizeTo(.05); }, hl:'.sw.rot'},
    {text:'可以在同一點繼續倒讓圓更大，或換個位置倒第二朵。', goal:['pour', 2]},
    {text:'切到「傾斜」，往不同方向各拖一下，讓圓圈流成花瓣的形狀。', goal:['tilt', 3], before:() => setTool('tilt'), hl:'.tool[data-tool=tilt]'},
    {text:'切到「吹」，從圓心往外輕輕吹出幾道放射紋。', goal:['blow', .8], before:() => setTool('blow'), hl:'.tool[data-tool=blow]'},
    {text:'完成！每次倒的時間、傾斜的方向都會讓結果不一樣。按「檔案」存下來吧。', hl:'#bFile'},
  ]},
  {name:'大理石紋', desc:'從條紋模板開始，吹出、流出優雅的大理石紋路。', tpl:'3-0', skip:1, tplOnly:true, steps:[
    S_PAL,
    {text:'用「吹」<b>橫向</b>拖過整個畫面，條紋會被拉成大理石紋。', goal:['blow', 1.5], before:() => setTool('blow'), hl:'.tool[data-tool=blow]'},
    {text:'換個方向，<b>斜斜地</b>再吹一兩次，紋路會更有層次。', goal:['blow', 1]},
    {text:'切到「傾斜」，往旁邊拖住，讓紋路慢慢流動延伸。', goal:['tilt', 2], before:() => setTool('tilt'), hl:'.tool[data-tool=tilt]'},
    {text:'最後用最淺的顏色點幾滴點綴，按一下就放開。', goal:['pour', .8], before:() => { const l = lumIdx(); useColor(l[l.length - 1]); sizeTo(.04); }},
    {text:'完成！按「檔案」存成圖片或暫存。', hl:'#bFile'},
  ]},
];
let lesson = null;
function renderLessons(){
  const box = $('#lessonList'); box.innerHTML = '';
  LESSONS.forEach(L => {
    const d = document.createElement('div'); d.className = 'lesson';
    d.innerHTML = `<b>${L.name}</b><p>${L.desc}</p><div class="acts">${L.tplOnly ? '' : '<button data-m="blank">從空白畫布開始</button>'}<button data-m="tpl" class="${L.tplOnly ? '' : 'alt'}">從模板開始</button></div>`;
    d.querySelectorAll('button').forEach(b => b.onclick = () => startLesson(L, b.dataset.m === 'tpl'));
    box.appendChild(d);
  });
}
function startLesson(L, fromTpl){
  newWork(); closeStart(); clearCanvas(); dirty = true;
  lesson = {L, i:0, fromTpl};
  gotoStep(0);
}
function gotoStep(i){
  const L = lesson.L;
  // 從模板開始：配色選完後套模板，再跳到吹的步驟
  if(lesson.fromTpl && lesson.i === 0 && i === 1){ applyTemplate(L.tpl); i = L.skip; }
  if(i >= L.steps.length) return endLesson();
  lesson.i = i; const st = L.steps[i];
  lesson.base = Object.assign({}, stats); lesson.done = !st.goal;
  $$('.sheet').forEach(e => e.hidden = true);
  if(st.before) st.before();
  $$('.pulse').forEach(e => e.classList.remove('pulse'));
  if(st.hl) $$(st.hl).forEach(e => e.classList.add('pulse'));
  $('#coach').hidden = false;
  $('#coachName').textContent = '教學：' + L.name;
  $('#coachStep').textContent = `第 ${i + 1} / ${L.steps.length} 步`;
  $('#coachText').innerHTML = st.text;
  $('#coachBar').style.display = st.goal ? '' : 'none';
  $('#coachBar i').style.width = '0';
  $('#coachNext').textContent = i === L.steps.length - 1 ? '完成' : '下一步';
  $('#coachNext').disabled = false;
  $('#coachNext').classList.toggle('pulse', !st.goal);
}
function coachTick(){
  if(!lesson || lesson.done) return;
  const [k, need] = lesson.L.steps[lesson.i].goal;
  const pr = Math.min(1, (stats[k] - lesson.base[k]) / need);
  $('#coachBar i').style.width = (pr * 100) + '%';
  if(pr >= 1){
    lesson.done = true;
    $('#coachText').insertAdjacentHTML('beforeend', ' <span class="good">做得好！可以繼續玩，滿意了就按「下一步」。</span>');
    $('#coachNext').classList.add('pulse');
  }
}
function endLesson(){
  if(!lesson) return;
  lesson = null; $('#coach').hidden = true;
  $$('.pulse').forEach(e => e.classList.remove('pulse'));
}
$('#coachNext').onclick = () => { if(lesson) gotoStep(lesson.i + 1); };
$('#coachQuit').onclick = () => { endLesson(); showHint('已結束教學，可以自由繼續畫'); };

/* ---------- 開始 ---------- */
applyLayout(); syncSettings(); renderSwatches();
resize();
// 開始畫面背景：隨機一個構圖
{ const demos = ['0-0', '0-2', '1-0', '1-3', '3-1']; TEMPLATES[demos[Math.floor(Math.random() * demos.length)]](); setTool('blow'); }
openStart();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
if(S.tilt === 'on') { S.tilt = 'off'; syncSettings(); }
</script>
