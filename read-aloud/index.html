<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="文件朗讀">
<title>文件朗讀</title>
<style>
:root{--bg:#0f1418;--panel:#182027;--line:#26313a;--fg:#e9eef2;--muted:#8a99a6;--accent:#2f80ed;--hl:#f2c94c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;cursor:pointer}
button:active{border-color:var(--accent)}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
header .name{flex:1;min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{padding:9px 12px;font-size:15px;white-space:nowrap}
#text{flex:1;overflow-y:auto;padding:16px 18px 40vh;font-size:20px;line-height:1.75;-webkit-overflow-scrolling:touch}
#text p{margin:0 0 .8em}
#text s{text-decoration:none;border-radius:4px;cursor:pointer}
#text s.cur{background:var(--hl);color:#111}
#pwList div{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
#pwList div span{flex:1;letter-spacing:.1em}
#pwList button{padding:6px 12px;font-size:14px}
#pwList p{margin:0;font-size:14px;color:var(--muted)}
#orig{flex:1;overflow-y:auto;padding:12px 12px 30vh;-webkit-overflow-scrolling:touch}
#orig .pimg{position:relative;margin:0 auto 14px;max-width:900px;cursor:pointer}
#orig .pimg div{font-size:13px;color:var(--muted);margin:0 2px 4px}
#orig .pimg canvas{display:block;width:100%;background:#fff;border-radius:4px;outline:3px solid transparent;outline-offset:2px}
#orig .pimg.cur canvas{outline-color:var(--hl)}
#orig .paper{background:#fff;color:#111;max-width:900px;margin:0 auto;padding:22px 20px;border-radius:6px;font-size:16px;line-height:1.6;font-family:"PingFang TC","Noto Sans TC",serif}
#orig .paper img{max-width:100%;height:auto}
#orig .paper table{border-collapse:collapse;width:100%;margin:.6em 0}
#orig .paper td,#orig .paper th{border:1px solid #999;padding:4px 6px;vertical-align:top}
#orig .paper p,#orig .paper li{margin:.4em 0}
#orig .paper .cur{background:#ffe58a}
#orig .paper hr.pb{border:0;border-top:2px dashed #bbb;margin:1.4em -20px}
#pageGrid canvas{width:100%;background:#fff;border-radius:3px;margin-bottom:4px}
#text h4.pg{margin:1.4em 0 .6em;font-size:14px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);padding-top:.6em;cursor:pointer}
#text h4.pg:first-child{margin-top:0}
#pageGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:55vh;overflow-y:auto}
#pageGrid button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;text-align:left}
#pageGrid button b{font-size:17px}
#pageGrid button span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#pageGrid button.on{border-color:var(--accent);background:#1d3350}
.empty{color:var(--muted);font-size:17px;line-height:1.7;padding-top:8vh;text-align:center}
.empty b{display:block;color:var(--fg);font-size:22px;margin-bottom:12px}
.empty .big{margin-top:24px;padding:18px 28px;font-size:20px;background:var(--accent);border-color:var(--accent);color:#fff}
.empty .paste{margin-top:12px;padding:14px 24px;font-size:17px}
#bar{border-top:1px solid var(--line);padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prog input{flex:1;accent-color:var(--accent)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctrl button{height:96px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ctrl button svg{width:38px;height:38px;fill:currentColor}
#play{background:var(--accent);border-color:var(--accent);color:#fff}
#play svg{width:52px;height:52px}
.speed{display:flex;align-items:center;gap:10px}
.speed button{flex:1;height:52px;font-size:22px}
.speed span{min-width:84px;text-align:center;font-size:18px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px;font-size:18px}
dialog textarea{width:100%;height:40vh;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
dialog select{width:100%;font:inherit;font-size:16px;padding:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
dialog .row button{padding:11px 18px;font-size:16px}
dialog .row .ok{background:var(--accent);border-color:var(--accent);color:#fff}
dialog label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
dialog p.note{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;display:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <div class="name" id="name">文件朗讀</div>
  <button id="pageBtn" hidden>頁</button>
  <button id="viewBtn" hidden>原稿</button>
  <button id="openBtn">開啟</button>
  <button id="setBtn" aria-label="設定">設定</button>
</header>
<div id="text"></div>
<div id="orig" hidden></div>
<div id="bar">
  <div class="prog"><span id="pos">0 / 0</span><input type="range" id="seek" min="0" max="0" value="0"><span id="pct">0%</span></div>
  <div class="ctrl">
    <button id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>上一句</button>
    <button id="play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg><span id="playTxt">播放</span></button>
    <button id="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>下一句</button>
  </div>
  <div class="speed"><button id="slower">慢</button><span id="rateTxt">1.0 倍</span><button id="faster">快</button></div>
</div>
<input type="file" id="file" accept=".pdf,.docx,.txt,.md,.html,.htm,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

<dialog id="openDlg">
  <h3>開啟文件</h3>
  <div class="row" style="justify-content:stretch;flex-direction:column">
    <button class="ok" id="pickFile" style="padding:16px">從「檔案」選擇（含 Dropbox、iCloud）</button>
    <button id="pasteBtn" style="padding:16px">貼上文字</button>
  </div>
  <p class="note">支援 PDF、Word（.docx）、純文字。檔案只在這支手機上讀取，不會上傳。<br>Gmail 附件：點開附件 → 分享 → 儲存到檔案，再從這裡選。</p>
  <button id="delBtn" style="width:100%;margin-top:14px;padding:14px;color:#ff8a80;border-color:#5a2a2a">刪除目前的檔案</button>
  <div class="row"><button id="openClose">取消</button></div>
</dialog>

<dialog id="pasteDlg">
  <h3>貼上要朗讀的文字</h3>
  <textarea id="pasteTxt" placeholder="長按貼上"></textarea>
  <div class="row"><button id="pasteCancel">取消</button><button class="ok" id="pasteOk">開始</button></div>
</dialog>

<dialog id="pageDlg">
  <h3>選擇頁面，點了就從那頁開始唸</h3>
  <label for="afterPage1" style="margin-top:0">每頁唸完後</label>
  <select id="afterPage1" class="afterPage" style="margin-bottom:12px"><option value="next">自動唸下一頁</option><option value="stop">停止</option></select>
  <div id="pageGrid"></div>
  <div class="row"><button class="ok" id="pageClose">關閉</button></div>
</dialog>

<dialog id="setDlg">
  <h3>設定</h3>
  <label for="voice">聲音</label>
  <select id="voice"></select>
  <label>記住的密碼（開有密碼的檔案時自動先試）</label>
  <div id="pwList"></div>
  <div style="display:flex;gap:8px;margin-top:8px"><input id="pwAdd" type="password" autocomplete="off" placeholder="新增密碼" style="flex:1;min-width:0;font:inherit;font-size:16px;padding:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px"><button id="pwAddBtn" style="padding:10px 16px">新增</button></div>
  <label for="afterPage2">每頁唸完後</label>
  <select id="afterPage2" class="afterPage"><option value="next">自動唸下一頁</option><option value="stop">停止</option></select>
  <label for="font">字體大小</label>
  <select id="font"><option value="17">小</option><option value="20">中</option><option value="24">大</option><option value="28">特大</option></select>
  <p class="note">朗讀時螢幕會保持亮著；鎖螢幕或切到別的 App，朗讀會停，回來按播放即可從原處繼續。<br>想要更自然的聲音：iPhone 設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文（台灣），下載「增強版」或「高品質」聲音，再回這裡選。</p>
  <div class="row"><button class="ok" id="setClose">完成</button></div>
</dialog>
<dialog id="pwDlg">
  <h3 id="pwMsg">這份 PDF 有設密碼</h3>
  <input id="pwIn" type="password" autocomplete="off" placeholder="輸入密碼" style="width:100%;font:inherit;font-size:18px;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px">
  <label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--fg);margin-top:12px"><input type="checkbox" id="pwRem" checked style="width:20px;height:20px">記住這個密碼，下次自動試</label>
  <p class="note">密碼只存在這支手機上，不會傳出去；可在「設定」刪除。</p>
  <div class="row"><button id="pwCancel">取消</button><button class="ok" id="pwOk">打開</button></div>
</dialog>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

let doc=null;          // {name, paras:[[sentence,...],...]}
let flat=[];           // [{p,s,text}]
let idx=0, playing=false, token=0, wakeLock=null;
let onlyPage=LS.get('ra_onlypage',false);
let orig=null;        // {type:'pdf'|'docx', buf, pw}
let pdfDoc=null, viewMode='text';
let rate=LS.get('ra_rate',1.0), voiceURI=LS.get('ra_voice',''), fontSize=LS.get('ra_font',20);

function toast(m,ms=2500){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}

/* ---------- 文字切句 ---------- */
function splitSentences(para){
  const out=[];let buf='';
  const re=/[^。！？!?；;…]*[。！？!?；;…]+[」』）)"'”’]*|[^。！？!?；;…]+$/g;
  const parts=para.replace(/([.])\s+(?=[A-Z"“(])/g,'$1 \u0001').split('\u0001').flatMap(x=>x.match(re)||[x]);
  for(let s of parts){
    // 太長的句子用逗號再切，避免 iPhone 語音中途斷掉
    while(s.length>160){
      let cut=-1;
      for(const ch of ['，',',','、','：',':',' ']){const i=s.lastIndexOf(ch,150);if(i>40){cut=i+1;break}}
      if(cut<0)cut=150;
      out.push(s.slice(0,cut));s=s.slice(cut);
    }
    if(s.trim())out.push(s);
  }
  // 太短的句子併到前一句
  const merged=[];
  for(const s of out){if(merged.length&&s.trim().length<4)merged[merged.length-1]+=s;else merged.push(s)}
  return merged;
}
function cleanText(raw){
  raw=raw.replace(/\r\n?/g,'\n').replace(/[ \t 　]+/g,' ').replace(/\f/g,'\n\n');
  const lines=raw.split('\n').map(l=>l.trim());
  const paras=[];let cur='';
  const endPunct=/[。！？!?；;：:」』)）"”]$/;
  for(const l of lines){
    if(!l){if(cur){paras.push(cur);cur=''}continue}
    if(/^\d{1,4}$/.test(l))continue; // 頁碼
    if(!cur){cur=l;continue}
    if(endPunct.test(cur)){paras.push(cur);cur=l;continue}
    // 斷行接回：中文直接接，英文補空格
    const a=cur.slice(-1),b=l[0];
    cur+=(/[A-Za-z0-9,.]/.test(a)&&/[A-Za-z0-9]/.test(b))?' '+l:l;
  }
  if(cur)paras.push(cur);
  return paras;
}
function setDoc(name,text,restore){
  // \f 是分頁符號：PDF 每頁、Word 的分頁位置
  const paras=[],pp=[];
  text.split('\f').forEach((pg,i)=>cleanText(pg).map(splitSentences).forEach(p=>{if(p.length){paras.push(p);pp.push(i+1)}}));
  if(!paras.length){toast('這份文件找不到可以朗讀的文字（可能是掃描圖片）',4000);return}
  stop();
  const nPages=text.split('\f').filter(x=>x.trim()).length>1?pp[pp.length-1]:1;
  doc={name,paras,pp,nPages};flat=[];
  paras.forEach((p,pi)=>p.forEach((s,si)=>flat.push({p:pi,s:si,pg:pp[pi],text:s})));
  const key=docKey();
  idx=restore?Math.min(LS.get('ra_pos',{})[key]||0,flat.length-1):(LS.get('ra_pos',{})[key]||0);
  if(idx>=flat.length)idx=0;
  if(!LS.set('ra_doc',{name,text})){try{localStorage.removeItem('ra_doc')}catch(e){}}
  render();
  if(idx>0&&!restore)toast('從上次的位置繼續（第 '+(idx+1)+' 句）');
}
function docKey(){return doc.name+'|'+flat.length}

/* ---------- 畫面 ---------- */
function render(){
  const box=$('text');
  $('name').textContent=doc?doc.name:'文件朗讀';
  if(!doc){
    box.innerHTML='<div class="empty"><b>開車時用聽的看文件</b>開啟 PDF、Word 或文字檔，<br>手機會一句一句唸給你聽。<br><button class="big" id="e1">開啟文件</button><br><button class="paste" id="e2">貼上文字</button></div>';
    $('e1').onclick=()=>$('file').click();$('e2').onclick=openPaste;
    updateBar();return;
  }
  const frag=document.createDocumentFragment();let n=0;
  let lastPg=0;
  doc.paras.forEach((p,pi)=>{
    if(doc.nPages>1&&doc.pp[pi]!==lastPg){lastPg=doc.pp[pi];const h=document.createElement('h4');h.className='pg';h.dataset.page=lastPg;h.textContent='第 '+lastPg+' 頁';frag.appendChild(h)}
    const el=document.createElement('p');p.forEach(s=>{const sp=document.createElement('s');sp.textContent=s;sp.dataset.i=n++;el.appendChild(sp)});frag.appendChild(el)});
  box.innerHTML='';box.appendChild(frag);
  box.scrollTop=0;
  highlight(true);updateBar();
}
function highlight(scroll){
  markOrig(scroll);
  const box=$('text');
  const old=box.querySelector('s.cur');if(old)old.classList.remove('cur');
  const el=box.querySelector('s[data-i="'+idx+'"]');
  if(el){el.classList.add('cur');if(scroll){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.top<b.top+20||r.bottom>b.top+b.height*0.55)box.scrollTo({top:box.scrollTop+r.top-b.top-b.height*0.25,behavior:'smooth'})}}
}
function updateBar(){
  const n=flat.length;
  $('pos').textContent=n?(idx+1)+' / '+n:'0 / 0';
  $('pct').textContent=n?Math.round(idx/Math.max(1,n-1)*100)+'%':'0%';
  $('seek').max=Math.max(0,n-1);$('seek').value=idx;
  const pb=$('pageBtn');pb.hidden=!(doc&&doc.nPages>1);
  if(doc&&flat[idx])pb.textContent='第 '+flat[idx].pg+' 頁'+(onlyPage?'・唸完停':'');
  $('rateTxt').textContent=rate.toFixed(1)+' 倍';
  $('playTxt').textContent=playing?'暫停':'播放';
  $('playIcon').innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $('text').style.fontSize=fontSize+'px';
}
function savePos(){if(!doc)return;const m=LS.get('ra_pos',{});m[docKey()]=idx;const keys=Object.keys(m);if(keys.length>30)delete m[keys[0]];LS.set('ra_pos',m)}

/* ---------- 朗讀 ---------- */
function pickVoice(){
  const vs=synth.getVoices();
  return vs.find(v=>v.voiceURI===voiceURI)||vs.find(v=>v.lang==='zh-TW'||v.lang==='zh_TW')||vs.find(v=>/^zh/i.test(v.lang))||null;
}
function speakCurrent(){
  if(!playing||!flat[idx])return;
  const my=++token;
  const u=new SpeechSynthesisUtterance(flat[idx].text);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='zh-TW';
  u.rate=rate;
  u.onend=()=>{if(my!==token||!playing)return;
    if(onlyPage&&idx<flat.length-1&&flat[idx+1].pg!==flat[idx].pg){idx++;savePos();highlight(true);playing=false;releaseWake();updateBar();toast('這一頁唸完了');return}
    if(idx<flat.length-1){idx++;savePos();highlight(true);updateBar();speakCurrent()}
    else{playing=false;releaseWake();updateBar();toast('唸完了')}};
  u.onerror=e=>{if(my!==token)return;if(e.error==='interrupted'||e.error==='canceled')return;
    playing=false;releaseWake();updateBar();toast('朗讀中斷，請再按播放')};
  synth.speak(u);
}
function play(){
  if(!doc){$('file').click();return}
  playing=true;synth.cancel();updateBar();highlight(true);requestWake();
  setTimeout(speakCurrent,60);
}
function stop(){playing=false;token++;synth.cancel();releaseWake();updateBar()}
function jump(i){
  if(!flat.length)return;
  idx=Math.max(0,Math.min(flat.length-1,i));savePos();highlight(true);updateBar();
  if(playing){token++;synth.cancel();setTimeout(speakCurrent,60)}
}
async function requestWake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(playing){stop();toast('已暫停')}}
  else if(playing)requestWake();
});

/* ---------- 讀檔 ---------- */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('載入失敗，請檢查網路'));document.head.appendChild(s)})}
async function loadPdfLib(){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
}
async function readPdf(buf){
  readPdf.pw=null;
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const task=pdfjsLib.getDocument({data:buf,cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'});
  const queue=savedPw();let used=null,typed=false;
  task.onPassword=(update,reason)=>{
    if(queue.length){used=queue.shift();typed=false;update(used);return}
    askPassword.keep=null;
    askPassword(reason===2&&typed).then(pw=>{if(pw==null){task.destroy()}else{used=pw;typed=true;update(pw)}})};
  let pdf;
  try{pdf=await task.promise;if(used&&(!typed||askPassword.keep===used))rememberPw(used);pdfDoc=pdf;readPdf.pw=used}catch(e){if(e&&e.name==='PasswordException'||/destroy|password/i.test(e&&e.message||''))throw new Error('已取消（需要密碼）');throw e}
  let out='';
  for(let i=1;i<=pdf.numPages;i++){
    toast('讀取第 '+i+' / '+pdf.numPages+' 頁…',60000);
    const tc=await (await pdf.getPage(i)).getTextContent();
    let lastY=null,line='';
    for(const it of tc.items){
      if(!('str' in it))continue;
      const y=it.transform[5];
      if(lastY!==null&&Math.abs(y-lastY)>(it.height||10)*0.5){out+=line+'\n';line=''}
      line+=it.str;lastY=y;
      if(it.hasEOL){out+=line+'\n';line='';lastY=null}

}
async function readDocx(buf){
  if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip=await JSZip.loadAsync(buf);
  const xml=await zip.file('word/document.xml').async('string');

  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const ps=d.getElementsByTagNameNS(W,'p');let out='';
  for(const p of ps){
    let t='';
    for(const n of p.getElementsByTagNameNS('*','*')){

/* ---------- 有密碼的 Word（Office 2007 以後的加密格式），全部在手機上解 ---------- */
const OLD_DOC='舊版 .doc 不支援，請先在 Word 另存成 .docx 或 PDF';
const cat=(...a)=>{const n=a.reduce((x,y)=>x+y.length,0),o=new Uint8Array(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const le32=i=>new Uint8Array([i&255,(i>>>8)&255,(i>>>16)&255,(i>>>24)&255]);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const utf16=s=>{const o=new Uint8Array(s.length*2);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);o[2*i]=c&255;o[2*i+1]=c>>8}return o};
const HASH={SHA1:'SHA-1','SHA-1':'SHA-1',SHA256:'SHA-256',SHA384:'SHA-384',SHA512:'SHA-512'};
async function dig(alg,data){return new Uint8Array(await crypto.subtle.digest(alg,data))}
async function spin(alg,salt,pw,count){
  let h=await dig(alg,cat(salt,utf16(pw)));
  const buf=new Uint8Array(4+h.length);
  for(let i=0;i<count;i++){buf[0]=i&255;buf[1]=(i>>>8)&255;buf[2]=(i>>>16)&255;buf[3]=i>>>24;buf.set(h,4);h=await dig(alg,buf)}
  return h;
}
// AES-CBC 解密不含補位的資料（WebCrypto 只收有 PKCS7 補位的，所以自己補一塊）
async function aesKey(raw){return crypto.subtle.importKey('raw',raw,'AES-CBC',false,['encrypt','decrypt'])}
async function cbcRaw(key,iv,data){
  const last=data.slice(data.length-16);
  const pad=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv:last},key,new Uint8Array(16).fill(16))).slice(0,16);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv},key,cat(data,pad)));
}
async function ecbRaw(key,data){
  const p=await cbcRaw(key,new Uint8Array(16),data);
  for(let i=p.length-1;i>=16;i--)p[i]^=data[i-16];
  return p;
}
const isZip=u=>u[0]===0x50&&u[1]===0x4b;
async function decryptAgile(info,pkg,pw){
  const xml=new DOMParser().parseFromString(new TextDecoder().decode(info.slice(8)),'application/xml');
  const kd=xml.getElementsByTagNameNS('*','keyData')[0];
  const ek=[...xml.getElementsByTagNameNS('*','encryptedKey')].find(e=>e.getAttribute('spinCount'));
  const alg=HASH[ek.getAttribute('hashAlgorithm')],kalg=HASH[kd.getAttribute('hashAlgorithm')];
  const keyBytes=+ek.getAttribute('keyBits')/8,salt=b64(ek.getAttribute('saltValue'));
  const h=await spin(alg,salt,pw,+ek.getAttribute('spinCount'));
  let k=await dig(alg,cat(h,new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6])));
  if(k.length<keyBytes)k=cat(k,new Uint8Array(keyBytes-k.length).fill(0x36));
  const secret=(await cbcRaw(await aesKey(k.slice(0,keyBytes)),salt,b64(ek.getAttribute('encryptedKeyValue')))).slice(0,+kd.getAttribute('keyBits')/8);
  const key=await aesKey(secret),ksalt=b64(kd.getAttribute('saltValue')),bs=+kd.getAttribute('blockSize');
  const size=new DataView(pkg.buffer,pkg.byteOffset).getUint32(0,true),data=pkg.subarray(8);
  const out=new Uint8Array(size);
  for(let i=0,off=0;off<size;i++,off+=4096){
    const seg=data.subarray(off,Math.min(off+4096,data.length));
    const iv=(await dig(kalg,cat(ksalt,le32(i)))).slice(0,bs);
    const dec=await cbcRaw(key,iv,seg);
    if(i===0&&!isZip(dec))return null; // 密碼錯
    out.set(dec.subarray(0,Math.min(dec.length,size-off)),off);
    if(i%50===0)toast('解鎖中… '+Math.round(off/size*100)+'%',60000);
  }
  return out;
}
async function decryptStandard(info,pkg,pw){
  const dv=new DataView(info.buffer,info.byteOffset,info.byteLength);
  const hsz=dv.getUint32(8,true),keyBits=dv.getUint32(12+16,true)||128;
  let o=12+hsz;const saltSize=dv.getUint32(o,true);
  const salt=info.slice(o+4,o+4+saltSize);o+=4+saltSize;
  const ev=info.slice(o,o+16),evh=info.slice(o+20,o+52);
  const h=await spin('SHA-1',salt,pw,50000);
  const hf=await dig('SHA-1',cat(h,le32(0)));
  const b1=new Uint8Array(64).fill(0x36),b2=new Uint8Array(64).fill(0x5c);
  for(let i=0;i<20;i++){b1[i]^=hf[i];b2[i]^=hf[i]}
  const kd=cat(await dig('SHA-1',b1),await dig('SHA-1',b2)).slice(0,keyBits/8);
  const key=await aesKey(kd);
  const v=await ecbRaw(key,ev),vh=(await ecbRaw(key,evh)).slice(0,20),want=await dig('SHA-1',v);
  if(want.some((x,i)=>x!==vh[i]))return null;
  const size=new DataView(pkg.buffer,pkg.byteOffset).getUint32(0,true);
  toast('解鎖中…',60000);
  return (await ecbRaw(key,pkg.subarray(8))).slice(0,size);
}
async function unlockOffice(buf){
  if(!window.CFB)await loadScript('https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js');
  const cfb=CFB.read(new Uint8Array(buf),{type:'array'});
  const ei=CFB.find(cfb,'EncryptionInfo'),ep=CFB.find(cfb,'EncryptedPackage');
  if(!ei||!ep){toast(OLD_DOC,5000);return null}
  const info=Uint8Array.from(ei.content),pkg=Uint8Array.from(ep.content);
  const ver=info[0]+'.'+info[2];
  let wrong=false;const queue=savedPw();
  for(;;){
    let pw,fromSaved=false;
    if(queue.length){pw=queue.shift();fromSaved=true}
    else{askPassword.keep=null;pw=await askPassword(wrong,'Word');if(pw==null){toast('已取消');return null}}
    toast('解鎖中…',60000);
    let out;
    if(ver==='4.4')out=await decryptAgile(info,pkg,pw);
    else if(info[2]===2)out=await decryptStandard(info,pkg,pw);
    else{toast('這種加密方式不支援，請在 Word 移除密碼或另存成 PDF',6000);return null}
    if(out&&isZip(out)){if(fromSaved||askPassword.keep===pw)rememberPw(pw);return out.buffer}
    if(!fromSaved)wrong=true;
  }
}
function decodeText(buf){
  let t=new TextDecoder('utf-8').decode(buf);
  const bad=(t.match(/�/g)||[]).length;
  if(bad>5){try{const b=new TextDecoder('big5').decode(buf);if((b.match(/�/g)||[]).length<bad)t=b}catch(e){}}
  return t;
}
async function openFile(f){
  if(!f)return;
  const name=f.name.replace(/\.[^.]+$/,'');
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{
    toast('讀取中…',60000);
    const buf=await f.arrayBuffer();
    const head=new Uint8Array(buf.slice(0,4));
    let text,o=null;
    if(ext==='pdf'||(head[0]===0x25&&head[1]===0x50)){const copy=buf.slice(0);text=await readPdf(buf);o={type:'pdf',buf:copy,pw:readPdf.pw}}
    else if(head[0]===0xD0&&head[1]===0xCF&&ext!=='txt'){
      const plain=await unlockOffice(buf);if(!plain)return;
      text=await readDocx(plain);o={type:'docx',buf:plain};
    }
    else if(ext==='docx'||(head[0]===0x50&&head[1]===0x4b)){text=await readDocx(buf);o={type:'docx',buf}}
    else if(ext==='doc'){toast('舊版 .doc 不支援，請先另存成 .docx 或 PDF',4000);return}
    else{text=decodeText(buf);if(/^(html?)$/.test(ext))text=new DOMParser().parseFromString(text,'text/html').body.innerText}
    $('toast').style.display='none';
    const keepPdf=o&&o.type==='pdf'?pdfDoc:null;
    setDoc(name,text,false);
    setOrig(o,keepPdf);
  }catch(e){console.error(e);toast(/^已取消/.test(e.message||'')?'已取消':'打不開這個檔案：'+(e.message||e),4000)}
}
